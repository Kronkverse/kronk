name: Auto-Deploy Staging

# Retired 2026-07-30. Shadow now auto-deploys `rebuild/2.0.0` via
# `auto-deploy-rebuild.yml` — pushes to `staging` no longer trigger a
# deploy, so parallel WIP branches don't fight for the single shadow
# environment. Kept as a `workflow_dispatch` shim for the rare case where
# a maintainer needs to override shadow to a specific branch by pushing
# to `staging` and then triggering this workflow manually.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy staging branch
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key claude@170.64.182.29 "deploy staging"
          rm -f ~/.ssh/key
