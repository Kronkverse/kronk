name: JavaScript Testing
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.snap'
      - '.github/workflows/test-js.yml'
      # Design-token pipeline — so `bin/generate-tokens --check` runs when
      # the source, generated output, or generator itself changes.
      - 'app/javascript/mastodon/tokens/tokens.yaml'
      - 'app/javascript/styles/mastodon/_tokens.scss'
      - 'bin/generate-tokens'

  pull_request:
    paths:
      - 'package.json'
      - 'yarn.lock'
      - '.nvmrc'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.snap'
      - '.github/workflows/test-js.yml'
      # Design-token pipeline — so `bin/generate-tokens --check` runs when
      # the source, generated output, or generator itself changes.
      - 'app/javascript/mastodon/tokens/tokens.yaml'
      - 'app/javascript/styles/mastodon/_tokens.scss'
      - 'bin/generate-tokens'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Javascript environment
        uses: ./.github/actions/setup-javascript

      - name: Verify tokens.scss matches tokens.yaml
        run: bin/generate-tokens --check

      - name: JavaScript testing
        run: yarn test:js
