name: Ruby Linting
on:
  merge_group:
  push:
    branches:
      - 'main'
      - 'stable-*'
    paths:
      - 'Gemfile*'
      - '.rubocop*.yml'
      - '.ruby-version'
      - 'bin/rubocop'
      - 'bin/lint-korner-docs'
      - 'config/brakeman.ignore'
      - 'config/korners/**'
      - 'docs/spaces/**'
      - '**/*.rb'
      - '**/*.rake'
      - '.github/workflows/lint-ruby.yml'

  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      BUNDLE_ONLY: development

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set-up RuboCop Problem Matcher
        uses: r7kamura/rubocop-problem-matchers-action@v1

      - name: Run rubocop
        run: bin/rubocop

      - name: Run brakeman
        if: always() # Run both checks, even if the first failed
        run: bin/brakeman

      # Fail if any `enforced: true` korner is missing its spec doc at
      # docs/spaces/<slug>.md. Docs presence is Standard L1 — enforcing
      # it here means a korner cannot ship live without its companion
      # doc. Grandfathered slugs are listed in bin/lint-korner-docs.
      - name: Check korner docs presence
        if: always()
        run: bin/lint-korner-docs
