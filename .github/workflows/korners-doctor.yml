name: Korners Doctor

# Runs `bin/tootctl korners doctor` — the Korner Standard conformance checker
# (docs/korners/korner_standard.md §3). Until 2026-08-12 nothing ran it, so
# "the doctor is green" was enforced nowhere and a broken check (the L1 icon
# lookup) sat unnoticed for weeks.
#
# NON-BLOCKING ON PURPOSE — `continue-on-error: true`, not named `lint`, not
# a required check. That was written when the doctor reported 27 real issues
# (L7 stylelint-governance gaps, L10 notifications declared but never
# registered, huddle's legacy security block, and 7 `kronk.*` nodes whose URLs
# matched no route), and making it gate ahead of that debt would have frozen
# the merge queue — exactly what happened when `lint` was made required before
# its own backlog was cleared.
#
# Re-measured 2026-09-17 on the rebuild tip: **11 warnings and no drift.** The
# debt above is gone. What remains is not drift at all:
#
#   * 9 × an L10 notification declared `planned: true` with no producer yet
#     (albutts, huddle ×3, moments ×3, rose) — the manifests say so on purpose.
#     Rose's carries the reasoning in the file: its only delivery path runs
#     through Notification, which is what the Nudges surfaces read, and a rose
#     in the messenger is the one thing it must not be.
#   * 1 × huddle's L4 feed card declared planned, projection not built.
#   * 2 × a bespoke composer not wrapped in <ComposeShell> (kommons_tree,
#     nudges_messenger).
#
# So the remaining path is shorter than this comment used to imply: decide
# whether `planned: true` should keep warning at all — arguably a manifest
# that declares intent honestly is conforming — then drop `continue-on-error`
# and make it required so conformance can't regress.
#
# No `merge_group:` trigger — since it doesn't gate, running it in the queue
# would be wasted Actions minutes (same reasoning as test-ruby.yml).

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'rebuild/2.0.0'
  workflow_dispatch:

env:
  BUNDLE_CLEAN: true
  BUNDLE_FROZEN: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repository. Declaring it
# explicitly stops the workflow inheriting whatever the repository
# default happens to be (CodeQL actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  korners-doctor:
    name: korners-doctor
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10ms
          --health-timeout 3s
          --health-retries 50
        ports:
          - 6379:6379

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASS: postgres
      RAILS_ENV: test
      BUNDLE_WITH: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby environment
        uses: ./.github/actions/setup-ruby

      # The doctor reads the frontend as plain text (icon map, card registry,
      # route mounts), so it needs no compiled assets and no yarn install —
      # only a schema, for the L2 table-drift check.
      - name: Load database schema
        run: bin/rails db:setup

      - name: Run korners doctor
        run: |
          set +e
          bin/tootctl korners doctor 2>&1 | tee doctor.log
          status=${PIPESTATUS[0]}

          {
            echo '## Korner Standard conformance'
            echo
            if [ "$status" -eq 0 ]; then
              echo 'Doctor is green — every enforced korner passes its required layers.'
            else
              echo 'Doctor reports issues (non-blocking — see the workflow header).'
            fi
            echo
            echo '```'
            cat doctor.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
