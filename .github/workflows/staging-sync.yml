name: Sync Staging with Main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: staging)'
        required: false
        default: staging

jobs:
  sync-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy branch to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'main' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          # The deploy action already runs migrations, stamps the version
          # label, and clears the instance cache. A separate migrate SSH is
          # both redundant and impossible here: the deploy key is
          # ForceCommand-locked to deploy|deploy-pr|stop|status, so any other
          # command (e.g. `cd … && rails db:migrate`) fails with
          # "Unknown action: cd".
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key claude@170.64.182.29 "deploy $BRANCH"
          rm -f ~/.ssh/key
