name: Sync Staging with Main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (default: staging)'
        required: false
        default: staging

jobs:
  sync-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy branch to staging
        env:
          DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'main' }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/key
          chmod 600 ~/.ssh/key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key claude@170.64.182.29 "deploy $BRANCH"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/key claude@170.64.182.29 "cd /home/mastodon/staging && RAILS_ENV=production bundle exec rails db:migrate"
          rm -f ~/.ssh/key
