<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub — arrangeable</title>
<style>
:root{
  --sunken:#12131a;
  --border:#2a2740;
  --text:#ece9f5;
  --text2:#9c9cc9;
  --muted:#606085;
  --bright:#7241ff;
  --glyph-on:#8c7dff;
  --glyph-off:#4e4a72;
  --font-brand:"Liberation Serif",Georgia,serif;
  --font-ui:system-ui,-apple-system,sans-serif;
  --size:114px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sunken);color:var(--text);font-family:var(--font-ui);
  padding:36px 24px 90px;-webkit-user-select:none;user-select:none}

h1{font-family:var(--font-brand);font-size:32px;color:var(--bright);text-align:center;margin:0 0 6px}
.lede{text-align:center;color:var(--text2);font-size:14px;margin:0 0 26px}


.hint{max-width:1000px;margin:0 auto 14px;text-align:center;font-size:12px;color:#a99cff;
  letter-spacing:.02em;opacity:0;height:0;overflow:hidden;transition:opacity .18s}
body.arranging .hint{opacity:1;height:auto;margin-bottom:14px}

.board{max-width:1000px;margin:0 auto;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--size),1fr));gap:10px}

/* ---------- korner ---------- */
.korner{
  position:relative;
  border-radius:20px;
  border:1px solid #34314f;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  aspect-ratio:1/1;
  touch-action:none;
  background:linear-gradient(160deg,#33314a 0%,#2a2840 48%,#232135 100%);
  box-shadow:
    0 4px 0 0 #1e1c2e,
    0 5px 0 0 #17151f,
    0 9px 16px -6px rgba(0,0,0,.7),
    inset 0 1.5px 0 rgba(255,255,255,.09),
    inset 0 -2px 5px rgba(0,0,0,.35);
  transition:transform .26s cubic-bezier(.34,1.56,.64,1),box-shadow .22s ease-out,border-color .16s,opacity .16s;
}
.korner:hover{
  border-color:#4b4382;
  transform:translateY(3px);
  box-shadow:0 1px 0 0 #1e1c2e,0 2px 0 0 #17151f,0 4px 9px -4px rgba(0,0,0,.7),
    inset 0 1.5px 0 rgba(255,255,255,.09),inset 0 -2px 5px rgba(0,0,0,.35);
}
.korner:focus-visible{outline:3px solid var(--bright);outline-offset:3px}

.glyph{width:48px;height:48px;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  stroke:var(--glyph-on);
  filter:drop-shadow(0 0 10px rgba(140,125,255,.4)) drop-shadow(0 2px 2px rgba(0,0,0,.6));
  transition:stroke .16s,filter .2s;pointer-events:none}
.korner:hover .glyph{filter:drop-shadow(0 0 16px rgba(140,125,255,.65)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}

.name{font-family:var(--font-brand);font-size:14.5px;line-height:1.1;text-align:center;
  padding:0 6px;color:var(--text);pointer-events:none}

.korner.off{
  background:linear-gradient(160deg,#26253a,#1f1e2d);
  border-color:#2a2840;
  box-shadow:0 3px 0 0 #1a1926,0 6px 11px -6px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
}
.korner.off .glyph{stroke:var(--glyph-off);filter:none}
.korner.off:hover .glyph{stroke:#6d68a0}
.korner.off .name{color:var(--muted)}
.korner.off:hover{transform:translateY(2px);
  box-shadow:0 1px 0 0 #1a1926,0 3px 7px -4px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05)}

.dot{position:absolute;left:9px;bottom:9px;width:5px;height:5px;border-radius:50%;
  background:var(--glyph-on);box-shadow:0 0 6px rgba(140,125,255,.8);pointer-events:none}
.korner.off .dot{display:none}

.gear{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:7px;
  display:grid;place-items:center;opacity:0;background:rgba(0,0,0,.25);color:var(--text2);
  font-size:12px;transition:opacity .15s}
.korner:hover .gear{opacity:.7}
.gear:hover{opacity:1!important;background:rgba(0,0,0,.5)}

.tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);
  background:#20202e;border:1px solid var(--border);color:var(--text2);
  font-size:11.5px;line-height:1.4;padding:7px 10px;border-radius:8px;width:170px;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .14s;z-index:5;
  box-shadow:0 10px 20px -8px rgba(0,0,0,.85)}
.korner:hover .tip{opacity:1}
body.dragging .tip{display:none}

/* ---------- arrange mode ---------- */
body.arranging .korner{
  animation:jiggle 2.6s ease-in-out infinite;
  cursor:grab;
}
body.arranging .korner:nth-child(even){animation-delay:-1.3s}
body.arranging .korner:hover{transform:none}
@keyframes jiggle{
  0%,100%{transform:rotate(-.5deg)}
  50%{transform:rotate(.5deg)}
}
body.arranging .grip{opacity:.55}
.grip{position:absolute;top:8px;left:8px;font-size:11px;color:var(--text2);opacity:0;
  transition:opacity .15s;letter-spacing:-1px;pointer-events:none}

/* the tile being dragged */
.korner.lifted{
  opacity:0;pointer-events:none;animation:none;
}
.floater{
  position:fixed;z-index:100;pointer-events:none;
  border-radius:20px;
  transform:scale(1.08) rotate(-2deg);
  box-shadow:0 22px 40px -10px rgba(0,0,0,.85),0 0 0 1px #5a4fa8,0 0 30px -6px rgba(114,65,255,.5);
  transition:none;
  animation:none!important;
}
.slot{
  border-radius:20px;border:1.5px dashed #4b4382;background:rgba(114,65,255,.05);
  aspect-ratio:1/1;
}

@media(prefers-reduced-motion:reduce){
  *{transition:none!important}
  body.arranging .korner{animation:none}
}
</style>
</head>
<body>

<h1>Hub</h1>
<p class="lede">Every korner on this instance. Drag them into the order that suits you.</p>

<p class="hint" id="hint">Drag to rearrange — tap anywhere else or press Esc when you're done.</p>

<div class="board" id="board"></div>

<script>
const I = {
  groups:`<circle cx="9" cy="8" r="3.2"/><path d="M2.5 19a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.4"/><path d="M17 15.5a5.5 5.5 0 0 1 4.5 3.5"/>`,
  flow:`<circle cx="12" cy="5" r="2.6"/><circle cx="5.5" cy="17" r="2.6"/><circle cx="18.5" cy="17" r="2.6"/><path d="M10.6 7.3 7 14M13.4 7.3 17 14M8.2 17.6h7.6"/>`,
  kalendar:`<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>`,
  market:`<rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M3 11h18"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/>`,
  kommons:`<path d="M14 13l-7.5 7.5a2.1 2.1 0 0 1-3-3L11 10"/><path d="M9.5 6.5l8 8M13 3l8 8M17.5 2.5l4 4"/>`,
  kuestions:`<path d="M9 9a3 3 0 1 1 4.5 2.6c-.9.5-1.5 1.2-1.5 2.4"/><circle cx="12" cy="18" r=".7" fill="currentColor" stroke="none"/>`,
  nudges:`<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M7 21l3-4"/>`,
  booth:`<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2.5" y="14" width="4.5" height="6" rx="1.6"/><rect x="17" y="14" width="4.5" height="6" rx="1.6"/>`,
  murmur:`<path d="M4 6h16M4 11h16M4 16h9"/>`,
  huddle:`<rect x="3" y="6" width="12" height="12" rx="2"/><path d="M15 10.5 21 7v10l-6-3.5z"/>`,
  kompass:`<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5.5-5.5 2 2-5.5z"/>`,
  moments:`<circle cx="12" cy="12" r="9" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="3.6"/>`,
  albutts:`<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-4 4 3 3-2.5 6 4.5"/>`,
  tides:`<path d="M2 9c3-3 5 3 8 0s5 3 8 0M2 15c3-3 5 3 8 0s5 3 8 0"/>`,
  seeds:`<path d="M12 21v-7"/><path d="M12 14c0-5 4-8 9-8 0 5-4 8-9 8z"/><path d="M12 16c0-3.5-2.5-6-6-6 0 3.5 2.5 6 6 6z"/>`,
  orbit:`<circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"/>`,
};

/* server order: this is what a user's korner_order array looks like */
const DEFAULT_ORDER = ["murmur","booth","kalendar","kommons","seeds","groups","kuestions","market",
  "kompass","flow","albutts","huddle","moments","nudges","tides","orbit"];

const META = {
  groups:["Groups","Shareable, multi-poster spaces.",1],
  flow:["In Flow","Kosmic weather, once a day.",1],
  kalendar:["Kalendar","The shared calendar for Kronk.",1],
  market:["Marketplace","Creations, listings, services — person-to-person.",1],
  kommons:["₭ommons","Where structural moves are decided.",1],
  kuestions:["Kuestions","Ask, answer, unlock.",1],
  nudges:["Nudges","Quiet pokes between members.",0],
  booth:["The Booth","Sets, releases, krates. Sound made here.",1],
  murmur:["Murmur","The feed. Chronological, always.",1],
  huddle:["Huddle","Drop into live video.",0],
  kompass:["Kompass","Who's where, at the precision you choose.",1],
  moments:["Moments","Ephemeral. Gone in a day.",0],
  albutts:["Albutts","Albums built by everyone who was there.",1],
  tides:["Tides","Your cycle, only yours.",0],
  seeds:["Seeds","Plant, grow, bear. Work done together.",1],
  orbit:["Orbit","Find what you haven't found.",0],
};

const board = document.getElementById('board');
let order = [...DEFAULT_ORDER];

function render(){
  board.innerHTML = order.map(k=>{
    const [n,d,on] = META[k];
    return `<div class="korner ${on?'':'off'}" data-k="${k}" tabindex="0">
      <span class="tip">${d}</span>
      <span class="grip">⠿</span>
      <span class="gear">⚙</span>
      <svg class="glyph" viewBox="0 0 24 24">${I[k]}</svg>
      <span class="name">${n}</span>
      <span class="dot"></span>
    </div>`;
  }).join('');
}
render();

/* ---------- drag to rearrange (pointer-based: mouse + touch) ---------- */
let drag = null;

board.addEventListener('pointerdown', e=>{
  const el = e.target.closest('.korner');
  if(!el || e.button === 1 || e.button === 2) return;
  const arranging = document.body.classList.contains('arranging');
  drag = {
    el, startX:e.clientX, startY:e.clientY, moved:false, armed:arranging,
    timer: arranging ? null : setTimeout(()=>{ drag && (drag.armed = true); enterArrange(); }, 380)
  };
  el.setPointerCapture(e.pointerId);
});

board.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if(!drag.moved && Math.hypot(dx,dy) > 6){
    if(!drag.armed){ clearTimeout(drag.timer); drag = null; return; } // it's a scroll/click, not a drag
    lift(e);
  }
  if(drag && drag.moved){
    drag.floater.style.left = (e.clientX - drag.ox) + 'px';
    drag.floater.style.top  = (e.clientY - drag.oy) + 'px';
    reorderTo(e.clientX, e.clientY);
  }
});

board.addEventListener('pointerup', e=>{
  if(!drag) return;
  clearTimeout(drag.timer);
  if(drag.moved) drop();
  drag = null;
});
board.addEventListener('pointercancel', ()=>{ if(drag){ clearTimeout(drag.timer); if(drag.moved) drop(); drag=null; }});

function lift(e){
  const el = drag.el, r = el.getBoundingClientRect();
  drag.moved = true;
  document.body.classList.add('dragging');
  const f = el.cloneNode(true);
  f.className = el.className + ' floater';
  f.style.width = r.width+'px'; f.style.height = r.height+'px';
  f.style.left = r.left+'px'; f.style.top = r.top+'px';
  document.body.appendChild(f);
  drag.floater = f;
  drag.ox = drag.startX - r.left;
  drag.oy = drag.startY - r.top;
  el.classList.add('lifted');
}

function reorderTo(x,y){
  const tiles = [...board.querySelectorAll('.korner')];
  let target = null, best = Infinity;
  for(const t of tiles){
    if(t === drag.el) continue;
    const r = t.getBoundingClientRect();
    const d = Math.hypot(x - (r.left+r.width/2), y - (r.top+r.height/2));
    if(d < best && d < r.width){ best = d; target = t; }
  }
  if(!target) return;

  // FLIP: record, move, invert, play
  const rects = new Map(tiles.map(t=>[t, t.getBoundingClientRect()]));
  const idxDrag = tiles.indexOf(drag.el), idxT = tiles.indexOf(target);
  if(idxDrag < idxT) target.after(drag.el); else target.before(drag.el);

  for(const t of tiles){
    if(t === drag.el) continue;
    const before = rects.get(t), after = t.getBoundingClientRect();
    const dx = before.left - after.left, dy = before.top - after.top;
    if(!dx && !dy) continue;
    t.style.transition = 'none';
    t.style.transform = `translate(${dx}px, ${dy}px)`;
    requestAnimationFrame(()=>{
      t.style.transition = 'transform .22s cubic-bezier(.16,1,.3,1)';
      t.style.transform = '';
    });
  }
  order = [...board.querySelectorAll('.korner')].map(t=>t.dataset.k);
}

function drop(){
  const r = drag.el.getBoundingClientRect();
  const f = drag.floater;
  f.style.transition = 'left .2s cubic-bezier(.16,1,.3,1), top .2s cubic-bezier(.16,1,.3,1), transform .2s ease';
  f.style.left = r.left+'px'; f.style.top = r.top+'px';
  f.style.transform = 'scale(1) rotate(0deg)';
  const el = drag.el;
  setTimeout(()=>{ f.remove(); el.classList.remove('lifted'); }, 200);
  document.body.classList.remove('dragging');
  // PATCH /api/v1/kronk/hub/order  { order: [...] }
  console.log('saved order →', order);
}

/* arrange mode — entered by long-press only */
function enterArrange(){
  if(document.body.classList.contains('arranging')) return;
  document.body.classList.add('arranging');
  if(navigator.vibrate) navigator.vibrate(12);   // haptic tick on touch
}
function exitArrange(){ document.body.classList.remove('arranging'); }

/* leave on Esc, or on any click that isn't a tile */
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') exitArrange(); });
document.addEventListener('pointerdown', e=>{
  if(!document.body.classList.contains('arranging')) return;
  if(!e.target.closest('.korner')) exitArrange();
}, true);

</script>
</body>
</html>
