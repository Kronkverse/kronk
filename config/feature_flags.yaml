# Kronk feature flags — boolean toggles for phased rollout.
#
# Shape: `default:` block for platform-wide defaults, then optional
# per-env override blocks (`development:`, `test:`, `production:`).
# A flag not listed anywhere resolves to `false`.
#
# Usage in code:
#   Kronk::FeatureFlags.enabled?(:tune_in_enforced)
#
# See lib/kronk/feature_flags.rb and docs/korners/adding_a_korner.md (Framework spec (v0.5)) §10.

default:
  # Gates the profile_cards API endpoints used by the shelved profile's
  # Arrange mode (card palette + per-card visibility). NOTE: the standalone
  # /@:acct/edit composer this flag was named for has been retired — the
  # flag now guards only the cards API, which Arrange depends on, so keep it
  # enabled. (Name kept to avoid a flag rename churn.)
  profile_composer: true
  # Read-time enforcement of the Home audience ladder (Me / Mates /
  # Orbit). When off, the scope chip persists but the home timeline is
  # unfiltered (Mates and Orbit show the same feed). When on,
  # Kronk::AudienceScope narrows the feed to the requested tier. Off by
  # default; flip on to test the ring end-to-end on shadow.
  feed_scope_enforced: false
  # Own-content nudges: froth / reply / mention on YOUR post publish a
  # Kronk::KornerEvents event that routes into the author's messenger
  # (Kronk::StatusNudges). Dual-runs alongside the legacy Notification store —
  # the legacy notification fires either way, this only adds the nudge — so the
  # two can be compared on real traffic before anything is cut over. See
  # docs/spaces/nudges.md (Retiring legacy notifications) phase 2.
  status_nudges: false

# Both kronk.info and shadow run RAILS_ENV=production, so every flag here is
# live for real people once the release carrying it is deployed, and on
# shadow as soon as it merges into `shadow`.
production:
  # The feed scope setting (Friends / Friends-of-friends / Kommunity).
  # On because the 2.0 feed is built around it — off would leave the
  # setting visible and inert.
  feed_scope_enforced: true
  # Answers the old Android app's API calls with "Kronk has moved to the
  # web" (lib/kronk/legacy_app_gate.rb). On in production because that is
  # where the 2.0 migrations land and every existing install starts
  # crashing on the timeline; a message beats a force-close. Turn off here
  # when the replacement app ships, or let it through by version with
  # LEGACY_APP_MIN_VERSION.
  legacy_app_gate: true
  # Nudges are the whole activity surface in 2.0 — they replaced the bell,
  # so this being off would mean no notifications at all, not a quieter
  # version of them.
  status_nudges: true
  # Tuning decides whether a korner reaches your feed (Home at every reach,
  # and Kommunity): Kronk::TuneInGate drops the cards of korners you've
  # tuned out of. On since 2026-10-11, when Kommons became opt-in by tuning
  # (docs/decisions.md). Off, the Hub and Feed settings toggles save but
  # change nothing.
  tune_in_enforced: true
# Uncomment and populate as more per-env overrides are needed.
# development: {}
# test: {}
