# Kronk cross-cutting nodes — the page-types not owned by a korner manifest.
#
# Each korner declares its own nodes under a `nodes:` block in
# `config/korners/<slug>.yaml`. This file holds everything else:
# feed surfaces, profile surfaces (public + own), and settings pages.
#
# Schema (see lib/kronk/node_registry.rb):
#   id         - stable identifier (bucket-prefixed dotted path). Feedback
#                proposals key on this — do not change once shipped.
#   bucket     - feed | profile | hub
#   parent     - (hub only) korner slug this node belongs to
#   label      - display name
#   url        - canonical URL template (display attr; not identity)
#   route_name - Rails route :as, used by the doctor drift check.
#                Optional. Omit + set spa: true for React-Router-only routes.
#   lifecycle  - live | soon | deprecated | hidden
#   spa        - true when the route lives only in React Router (no Rails route)
#
# Anti-drift: `bin/tootctl korners doctor` validates that every node's
# route_name resolves against Rails.application.routes, unless spa: true.

nodes:
  # ── FEED ──────────────────────────────────────────────────────────
  - id: feed.home
    bucket: feed
    label: Home timeline
    url: /home
    lifecycle: live
    spa: true
    links:
      - to: kommons.index
        kind: projects_to
        description: Kommons proposals appear here as Kommons cards.
      - to: booth.index
        kind: projects_to
        description: Booth sets appear here as space cards.
      - to: kuestions.index
        kind: projects_to
        description: Kuestions project into the feed as question cards.

  # ── NUDGES ────────────────────────────────────────────────────────
  #
  # A top-level space, not a sub-tree of the feed and not a korner. It sits
  # in the primary switcher alongside Me, Home, and Hub (`hub_switcher.tsx`),
  # and there is no `/hub/nudges` route. `config/korners/nudges.yaml` is the
  # pillar's own manifest — now `core: true` / `pillar: true` / `enforced: true`.
  #
  # `feed.nudges` lived here until 2026-09-10. It was the old
  # /nudges/activity surface, which merged into the Nudges landing — leaving
  # two nodes on one URL, so a proposal about Nudges could land on either and
  # the conversation split. It was kept for id stability, because ids are what
  # feedback attaches to and renaming one orphans its proposals; it carried
  # none, so there was nothing left to protect.
  - id: nudges.index
    bucket: nudges
    label: Nudges
    url: /nudges
    lifecycle: live
    spa: true

  # `nudges.thread` removed 2026-09-10: one conversation is a page inside
  # Nudges, and `nudges.index` already carries that space.
  - id: profile.view
    bucket: profile
    label: Someone's profile
    url: /@:user
    route_name: short_account
    lifecycle: live
    links:
      - to: feed.home
        kind: related
        description: Statuses posted here appear in followers' home timelines.
      - to: settings.sections
        kind: settings_for
        description: Rearrange your sections in Settings → Sections.
      - to: booth.index
        kind: listens_to
        description: Booth sets can be surfaced as a profile section.

  # Editing your profile is now Arrange mode on the shelved profile — the
  # standalone /@:acct/edit composer was retired (identity editor folded into
  # Arrange). The /edit URL still resolves (bookmarks, the settings-nav entry)
  # but redirects into the shelved profile at /@:user, where Arrange
  # edits display name, bio, avatar, header and metadata fields.
  # `profile.edit`, `profile.media` and `profile.mates` removed 2026-09-10.
  # They are pages inside somebody's profile, not spaces of their own; a
  # proposal about the profile editor belongs to Profile.
  #
  # `profile.view` stays and carries the Profile space. It takes a
  # parameter like the detail pages that were removed elsewhere, but there
  # is no unparameterised profile page to stand in its place — a profile is
  # always somebody's — so removing it would leave the limb with nothing to
  # attach a proposal to.
  - id: settings.profile
    bucket: settings
    label: Settings · Profile
    url: /settings/profile
    route_name: settings_profile
    lifecycle: live
    links:
      # Was `profile.edit`, which went with the other pages-inside-a-space on
      # 2026-09-10. The relationship is to the profile itself: editing happens
      # in Arrange mode there rather than on a page of its own.
      - to: profile.view
        kind: settings_for
        description: Same account attributes; Arrange on the profile is the modern entry point.

  - id: settings.sections
    bucket: settings
    label: Settings · Sections
    url: /settings/profile_sections
    lifecycle: live
    spa: true
    links:
      - to: profile.view
        kind: settings_for
        description: Configures the sectioned profile render.

  # `deprecated`: /settings/preferences is a bare redirect to
  # /settings/preferences/appearance (config/routes/settings.rb). The registry
  # was advertising a redirect as a destination, so feedback filed here was
  # filed against nothing.
  - id: settings.prefs
    bucket: settings
    label: Preferences
    url: /settings/preferences
    route_name: settings_preferences
    lifecycle: deprecated

  - id: settings.you
    bucket: settings
    label: Settings · You
    url: /settings/you
    lifecycle: live
    spa: true

  # The rebuilt SPA settings sections (settings rebuild §7). The settings nav
  # projects all settings.* nodes from this bucket.
  - id: settings.appearance
    bucket: settings
    label: Appearance
    url: /settings/appearance
    lifecycle: live
    spa: true
  - id: settings.posting
    bucket: settings
    label: Posting
    url: /settings/posting
    lifecycle: live
    spa: true
  - id: settings.privacy
    bucket: settings
    label: Privacy
    url: /settings/privacy
    lifecycle: live
    spa: true
  - id: settings.notifications
    bucket: settings
    label: Notifications
    url: /settings/notifications
    lifecycle: live
    spa: true
  # Still the classic Mastodon monolith — Devise + Doorkeeper for
  # Account & Security (2FA, sessions, apps, migration, delete),
  # Rails export/import for Data. `spa: false` so the client hands
  # navigation to the browser (full page load into the classic Rails
  # views) instead of the SPA router hitting a dead route.
  - id: settings.account
    bucket: settings
    label: Account & security
    # Kronk-native landing (Phase 1, 2026-08-14). Renders signed-in
    # devices + recent sign-ins natively and links out to the classic
    # Devise flows (change email/password, 2FA, migration, delete) that
    # are not yet rebuilt — see docs/rebuild/settings_inventory.md and the
    # Account & Security scope. Was `soon`/`spa:false` pointing at the 2FA
    # classic route while nothing native existed.
    url: /settings/account
    lifecycle: live
    spa: true
  - id: settings.data
    bucket: settings
    label: Data
    # Kronk-native landing (2026-08-14). Presents export (archive + CSV
    # downloads) and import in Kronk chrome; the operations themselves —
    # the backup job, CSV file responses, and multipart import+confirm —
    # stay on the classic Rails pages behind links (no JSON API, and the
    # machinery works). Was `soon`/`spa:false` pointing straight at the
    # classic /settings/export.
    url: /settings/data
    lifecycle: live
    spa: true

  # ── HUB (landing only — per-korner nodes live in their manifests) ─
  #
  # Kept as its own tree node so proposals about the Hub grid itself
  # (as a page — its layout, tile order, empty state) have a target
  # to attach to (Tal 2026-09-08). Yes it lands under Hub and "Hub in
  # Hub" reads a touch recursive, but the alternative is Kronkers with
  # nowhere to put "here's how the Hub could work better" without it
  # being tagged against some random korner tile.
  - id: hub.landing
    bucket: hub
    label: Hub grid
    url: /hub
    lifecycle: live
    spa: true

  # ── Per-limb settings (see docs/kronk_settings_ia.md). The personal/account
  # settings live in the `settings` bucket above; a space configures itself in
  # its own limb — Feed's display prefs hang off the feed limb — so this
  # stays in feed, not `settings`.
  - id: settings.feed
    bucket: feed
    label: Feed settings
    url: /home/settings
    lifecycle: live
    spa: true

  # Hub settings — bucket: settings, not hub. Lives under Settings in
  # the Directory tree (that's where a Kronker would go looking for a
  # settings page); the /hub/settings URL stays the same. Tal
  # 2026-09-08 — the compose-CTA sweep (Ж menu owns Settings) means
  # settings shouldn't be a Hub-branch leaf, but a proposal target
  # for "here's how the Hub grid could work better" still needs a
  # discoverable home, and Settings is where the rest of Kronk's
  # `settings.*` nodes already live.
  - id: settings.hub
    bucket: settings
    label: Hub settings
    url: /hub/settings
    lifecycle: live
    spa: true

  # ── KRONK (the organisation pillar, §O) ──────────────────────────────
  #
  # The org space is served by KronkController from markdown under
  # content/kronk/ (routes: `/kronk/:page`); the ЖЯѺƝ₭ wordmark links here.
  # These nodes put its real pages in the Kommons Directory so members can see and
  # plant proposals about how Kronk itself is run and built. `spa: true` skips
  # the route-name drift check — there is no per-page named Rails route (the
  # single `/kronk/:page` route serves them all), so there is nothing to bind.
  # ── Search ─────────────────────────────────────────────────────────
  # Its own bucket rather than a page under Hub: search is not a korner and
  # is not owned by one, it reaches across all of them. On the Directory it
  # hangs off the root with Kronk and Settings — the things you use to work
  # the place rather than the places themselves.
  - id: search.index
    bucket: search
    label: Search
    url: /hub/search
    lifecycle: live
    spa: true

  - id: kronk.about
    bucket: kronk
    label: About Kronk
    url: /kronk
    lifecycle: live
    spa: true
  - id: kronk.how_it_works
    bucket: kronk
    label: How Kronk works
    url: /kronk/how-it-works
    lifecycle: live
    spa: true
  - id: kronk.values
    bucket: kronk
    label: Values & manifesto
    url: /kronk/values
    lifecycle: live
    spa: true
  - id: kronk.governance
    bucket: kronk
    label: Governance
    url: /kronk/governance
    lifecycle: live
    spa: true
  - id: kronk.contributors
    bucket: kronk
    label: Contributors
    url: /kronk/contributors
    lifecycle: live
    spa: true
  - id: kronk.privacy
    bucket: kronk
    label: Privacy
    url: /kronk/privacy
    lifecycle: live
    spa: true
  - id: kronk.terms
    bucket: kronk
    label: Terms of service
    url: /kronk/terms
    lifecycle: live
    spa: true
  - id: kronk.rules
    bucket: kronk
    label: Rules
    url: /kronk/rules
    lifecycle: live
    spa: true
  - id: kronk.announcements
    bucket: kronk
    label: Announcements
    url: /kronk/announcements
    lifecycle: live
    spa: true
  - id: kronk.contact
    bucket: kronk
    label: Contact
    url: /kronk/contact
    lifecycle: live
    spa: true
