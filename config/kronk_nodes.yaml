# Kronk cross-cutting nodes — the page-types not owned by a korner manifest.
#
# Each korner declares its own nodes under a `nodes:` block in
# `config/korners/<slug>.yaml`. This file holds everything else:
# feed surfaces, profile surfaces (public + own), and settings pages.
#
# Schema (see lib/kronk/node_registry.rb):
#   id         - stable identifier (bucket-prefixed dotted path). Feedback
#                proposals key on this — do not change once shipped.
#   bucket     - feed | profile | hub
#   parent     - (hub only) korner slug this node belongs to
#   label      - display name
#   url        - canonical URL template (display attr; not identity)
#   route_name - Rails route :as, used by the doctor drift check.
#                Optional. Omit + set spa: true for React-Router-only routes.
#   lifecycle  - live | soon | deprecated | hidden
#   spa        - true when the route lives only in React Router (no Rails route)
#
# Anti-drift: `bin/tootctl korners doctor` validates that every node's
# route_name resolves against Rails.application.routes, unless spa: true.

nodes:
  # ── FEED ──────────────────────────────────────────────────────────
  - id: feed.home
    bucket: feed
    label: Home timeline
    url: /home
    lifecycle: live
    spa: true
    links:
      - to: kommons.index
        kind: projects_to
        description: Kommons proposals appear here as Kommons cards.
      - to: booth.index
        kind: projects_to
        description: Booth sets appear here as space cards.
      - to: kuestions.index
        kind: projects_to
        description: Kuestions project into the feed as question cards.

  # ── NUDGES ────────────────────────────────────────────────────────
  #
  # A top-level space, not a sub-tree of the feed and not a korner. It sits
  # in the primary switcher alongside Me and Home (`hub_switcher.tsx`), and
  # there is no `/hub/nudges` route — `config/korners/nudges.yaml` still
  # carries `enforced: false` for exactly that reason.
  #
  # `feed.nudges` kept its id: node ids are the anchor feedback attaches to,
  # so renaming one orphans its proposals. The id records history; the bucket
  # records where it lives.
  - id: feed.nudges
    bucket: nudges
    label: Nudges activity
    url: /nudges/activity
    lifecycle: live
    spa: true

  - id: nudges.index
    bucket: nudges
    label: Nudges
    url: /nudges
    lifecycle: live
    spa: true

  - id: nudges.thread
    bucket: nudges
    label: Nudge thread
    url: /nudges/:accountId
    lifecycle: live
    spa: true

  # The rest of the feed bucket. Every entry below is an existing route,
  # not a plan — the Skeleton is a map of what Kronk *is*, and a node that
  # names nothing is a place feedback can be filed against and never acted
  # on. Where a surface has no node, proposals about it have nowhere to
  # land except the korner index, which is how a specific complaint turns
  # into a vague one.
  - id: feed.local
    bucket: feed
    label: Local timeline
    url: /public/local
    lifecycle: live
    spa: true

  - id: feed.federated
    bucket: feed
    label: Federated timeline
    url: /public
    lifecycle: live
    spa: true

  - id: feed.explore
    bucket: feed
    label: Explore
    url: /explore
    lifecycle: live
    spa: true

  - id: feed.tag
    bucket: feed
    label: Hashtag timeline
    url: /tags/:id
    lifecycle: live
    spa: true

  - id: feed.compose
    bucket: feed
    label: Composer
    url: /publish
    lifecycle: live
    spa: true
    links:
      - to: feed.home
        kind: creates
        description: Posting here is what puts a card in the home feed.

  - id: feed.status
    bucket: feed
    label: Post detail
    url: /@:user/:id
    lifecycle: live
    spa: true

  # "Froth" is the Kronk word for a favourite — user-facing copy uses it,
  # the column and route keep Mastodon's spelling.
  - id: feed.froths
    bucket: feed
    label: Froths
    url: /favourites
    lifecycle: live
    spa: true

  - id: feed.bookmarks
    bucket: feed
    label: Bookmarks
    url: /bookmarks
    lifecycle: live
    spa: true

  - id: feed.lists
    bucket: feed
    label: Lists
    url: /lists/:id
    lifecycle: live
    spa: true

  # ── PROFILE ───────────────────────────────────────────────────────
  - id: profile.view
    bucket: profile
    label: Someone's profile
    url: /@:user
    route_name: short_account
    lifecycle: live
    links:
      - to: feed.home
        kind: related
        description: Statuses posted here appear in followers' home timelines.
      - to: profile.sections
        kind: related
        description: The sectioned view is the primary render of this profile.

  # `soon`, not `live`: features/profile_compose renders
  # `profile_compose.header_stub` — "Cover image, avatar and display name —
  # editing lands in the next step." Display name, bio, avatar, header and
  # metadata fields are still only editable on the classic Rails page. A
  # `live` node here told the settings nav, the Skeleton map and anyone
  # filing feedback that a working composer existed.
  - id: profile.edit
    bucket: profile
    label: Profile composer
    url: /@:user/edit
    lifecycle: soon
    spa: true
    links:
      - to: settings.profile
        kind: settings_for
        description: Configures the same account attributes as classic settings.

  - id: profile.sections
    bucket: profile
    label: Sectioned profile
    url: /@:user/profile
    lifecycle: live
    spa: true
    links:
      - to: settings.sections
        kind: settings_for
        description: Rearrange your sections in Settings → Sections.
      - to: booth.index
        kind: listens_to
        description: Booth sets can be surfaced as a profile section.

  - id: profile.media
    bucket: profile
    label: Profile media
    url: /@:user/media
    lifecycle: live
    spa: true

  - id: profile.connections
    bucket: profile
    label: Profile connections
    url: /@:user/connections
    lifecycle: live
    spa: true

  # Settings surfaces — grouped under Profile in the tree since they
  # are the self-management side of the same identity.
  - id: settings.profile
    bucket: profile
    parent: settings.root
    label: Settings · Profile
    url: /settings/profile
    route_name: settings_profile
    lifecycle: live
    links:
      - to: profile.edit
        kind: settings_for
        description: Same account attributes; the composer is the modern entry point.

  - id: settings.sections
    bucket: profile
    parent: settings.root
    label: Settings · Sections
    url: /settings/profile_sections
    lifecycle: live
    spa: true
    links:
      - to: profile.sections
        kind: settings_for
        description: Configures the sectioned profile render.

  # `deprecated`: /settings/preferences is a bare redirect to
  # /settings/preferences/appearance (config/routes/settings.rb). The registry
  # was advertising a redirect as a destination, so feedback filed here was
  # filed against nothing.
  - id: settings.prefs
    bucket: profile
    parent: settings.root
    label: Preferences
    url: /settings/preferences
    route_name: settings_preferences
    lifecycle: deprecated

  # The two settings roots. Both have shipped routes and neither was
  # registered, so the settings hub — the surface a user actually lands on —
  # had nowhere for feedback to attach.
  #
  # Bucket is `profile` because that is where the rest of settings.* is filed
  # and where the code puts it. It is not a claim that settings belongs to
  # Profile: settings has no honest home under the current scheme, and the
  # section cut is still open. See docs/rebuild/decisions.md.
  - id: settings.root
    bucket: profile
    label: Settings
    url: /settings
    lifecycle: live
    spa: true

  - id: settings.you
    bucket: profile
    parent: settings.root
    label: Settings · You
    url: /settings/you
    lifecycle: live
    spa: true

  # The rebuilt SPA settings sections (settings rebuild §7). Grouped under
  # Profile ("self-management"); the settings nav projects all settings.* nodes.
  - id: settings.appearance
    bucket: profile
    parent: settings.root
    label: Appearance
    url: /settings/appearance
    lifecycle: live
    spa: true
  - id: settings.posting
    bucket: profile
    parent: settings.root
    label: Posting
    url: /settings/posting
    lifecycle: live
    spa: true
  - id: settings.privacy
    bucket: profile
    parent: settings.root
    label: Privacy
    url: /settings/privacy
    lifecycle: live
    spa: true
  - id: settings.notifications
    bucket: profile
    parent: settings.root
    label: Notifications
    url: /settings/notifications
    lifecycle: live
    spa: true
  # Still the classic Mastodon monolith — surfaced as `soon` until rehomed.
  - id: settings.account
    bucket: profile
    parent: settings.root
    label: Account & security
    url: /settings/account
    lifecycle: soon
    spa: true
  - id: settings.data
    bucket: profile
    parent: settings.root
    label: Data
    url: /settings/data
    lifecycle: soon
    spa: true

  # ── HUB (landing only — per-korner nodes live in their manifests) ─
  - id: hub.landing
    bucket: hub
    label: Hub grid
    url: /hub
    lifecycle: live
    spa: true

  # ── SETTINGS (see docs/kronk_settings_ia.md) — three surfaces mapped to the
  # three buckets: Feed (incoming), Profile (self-management: composer + posting
  # + discoverability + Account/Appearance/Data folded in as sections), Hub
  # (spaces). Profile settings already exist above (settings.profile/.sections/
  # .prefs in the profile bucket); these are the two genuinely-new surfaces.
  - id: settings.feed
    bucket: feed
    label: Feed settings
    url: /home/settings
    lifecycle: live
    spa: true
  - id: settings.hub
    bucket: hub
    label: Hub settings
    url: /settings/korners
    lifecycle: live
    spa: true
