# Kronk cross-cutting nodes — the page-types not owned by a korner manifest.
#
# Each korner declares its own nodes under a `nodes:` block in
# `config/korners/<slug>.yaml`. This file holds everything else:
# feed surfaces, profile surfaces (public + own), and settings pages.
#
# Schema (see lib/kronk/node_registry.rb):
#   id         - stable identifier (bucket-prefixed dotted path). Feedback
#                proposals key on this — do not change once shipped.
#   bucket     - feed | profile | hub
#   parent     - (hub only) korner slug this node belongs to
#   label      - display name
#   url        - canonical URL template (display attr; not identity)
#   route_name - Rails route :as, used by the doctor drift check.
#                Optional. Omit + set spa: true for React-Router-only routes.
#   lifecycle  - live | soon | deprecated | hidden
#   spa        - true when the route lives only in React Router (no Rails route)
#
# Anti-drift: `bin/tootctl korners doctor` validates that every node's
# route_name resolves against Rails.application.routes, unless spa: true.

nodes:
  # ── FEED ──────────────────────────────────────────────────────────
  - id: feed.home
    bucket: feed
    label: Home timeline
    url: /home
    lifecycle: live
    spa: true
    links:
      - to: kommons.index
        kind: projects_to
        description: Kommons proposals appear here as Kommons cards.
      - to: booth.index
        kind: projects_to
        description: Booth sets appear here as space cards.
      - to: kuestions.index
        kind: projects_to
        description: Kuestions project into the feed as question cards.

  # ── NUDGES ────────────────────────────────────────────────────────
  #
  # A top-level space, not a sub-tree of the feed and not a korner. It sits
  # in the primary switcher alongside Me, Home, and Hub (`hub_switcher.tsx`),
  # and there is no `/hub/nudges` route. `config/korners/nudges.yaml` is the
  # pillar's own manifest — now `core: true` / `pillar: true` / `enforced: true`.
  #
  # `feed.nudges` kept its id: node ids are the anchor feedback attaches to,
  # so renaming one orphans its proposals. The id records history; the bucket
  # records where it lives.
  - id: feed.nudges
    bucket: nudges
    label: Nudges activity
    # /nudges/activity was retired (it 301-redirects to /nudges); the
    # activity surface merged into the Nudges landing.
    url: /nudges
    lifecycle: live
    spa: true

  - id: nudges.index
    bucket: nudges
    label: Nudges
    url: /nudges
    lifecycle: live
    spa: true

  - id: nudges.thread
    bucket: nudges
    label: Nudge thread
    url: /nudges/:conversationId
    lifecycle: live
    spa: true

  # Feed is the one continuous-scroll surface, and feed.home is it. The
  # local/federated/explore/tag timelines, the froths/bookmarks/lists
  # collections, and the compose/status routes were removed as Directory nodes:
  # feed *scope* (Friends / FoF / Kommunity) is a setting on the one feed
  # (settings.feed), not a set of separate destinations — and a post permalink
  # and the Post action are not places in the Directory. See docs/spaces/feed.md.

  # ── PROFILE ───────────────────────────────────────────────────────
  - id: profile.view
    bucket: profile
    label: Someone's profile
    url: /@:user
    route_name: short_account
    lifecycle: live
    links:
      - to: feed.home
        kind: related
        description: Statuses posted here appear in followers' home timelines.
      - to: profile.sections
        kind: related
        description: The sectioned view is the primary render of this profile.

  # `soon`, not `live`: features/profile_compose renders
  # `profile_compose.header_stub` — "Cover image, avatar and display name —
  # editing lands in the next step." Display name, bio, avatar, header and
  # metadata fields are still only editable on the classic Rails page. A
  # `live` node here told the settings nav, the Directory and anyone
  # filing feedback that a working composer existed.
  - id: profile.edit
    bucket: profile
    label: Profile composer
    url: /@:user/edit
    lifecycle: soon
    spa: true
    links:
      - to: settings.profile
        kind: settings_for
        description: Configures the same account attributes as classic settings.

  - id: profile.sections
    bucket: profile
    label: Sectioned profile
    url: /@:user/profile
    lifecycle: live
    spa: true
    links:
      - to: settings.sections
        kind: settings_for
        description: Rearrange your sections in Settings → Sections.
      - to: booth.index
        kind: listens_to
        description: Booth sets can be surfaced as a profile section.

  - id: profile.media
    bucket: profile
    label: Profile media
    url: /@:user/media
    lifecycle: live
    spa: true

  - id: profile.connections
    bucket: profile
    label: Profile connections
    url: /@:user/connections
    lifecycle: live
    spa: true

  # Settings surfaces — the `settings` bucket is Settings' own core space
  # (manifest config/korners/settings.yaml). The section pages sit directly on
  # the Settings limb, flat like Feed/Profile pages: the limb *is* the entry, so
  # there is no /settings landing node to open through. settings.feed and
  # settings.hub live in the feed/hub buckets (below) — a space configures itself
  # in its own limb. Some pages link back to the profile page they configure via
  # `settings_for`. See docs/rebuild/decisions.md and docs/spaces/settings.md.
  - id: settings.profile
    bucket: settings
    label: Settings · Profile
    url: /settings/profile
    route_name: settings_profile
    lifecycle: live
    links:
      - to: profile.edit
        kind: settings_for
        description: Same account attributes; the composer is the modern entry point.

  - id: settings.sections
    bucket: settings
    label: Settings · Sections
    url: /settings/profile_sections
    lifecycle: live
    spa: true
    links:
      - to: profile.sections
        kind: settings_for
        description: Configures the sectioned profile render.

  # `deprecated`: /settings/preferences is a bare redirect to
  # /settings/preferences/appearance (config/routes/settings.rb). The registry
  # was advertising a redirect as a destination, so feedback filed here was
  # filed against nothing.
  - id: settings.prefs
    bucket: settings
    label: Preferences
    url: /settings/preferences
    route_name: settings_preferences
    lifecycle: deprecated

  - id: settings.you
    bucket: settings
    label: Settings · You
    url: /settings/you
    lifecycle: live
    spa: true

  # The rebuilt SPA settings sections (settings rebuild §7). The settings nav
  # projects all settings.* nodes from this bucket.
  - id: settings.appearance
    bucket: settings
    label: Appearance
    url: /settings/appearance
    lifecycle: live
    spa: true
  - id: settings.posting
    bucket: settings
    label: Posting
    url: /settings/posting
    lifecycle: live
    spa: true
  - id: settings.privacy
    bucket: settings
    label: Privacy
    url: /settings/privacy
    lifecycle: live
    spa: true
  - id: settings.notifications
    bucket: settings
    label: Notifications
    url: /settings/notifications
    lifecycle: live
    spa: true
  # Still the classic Mastodon monolith — Devise + Doorkeeper for
  # Account & Security (2FA, sessions, apps, migration, delete),
  # Rails export/import for Data. `spa: false` so the client hands
  # navigation to the browser (full page load into the classic Rails
  # views) instead of the SPA router hitting a dead route.
  - id: settings.account
    bucket: settings
    label: Account & security
    url: /settings/account
    lifecycle: soon
    spa: false
  - id: settings.data
    bucket: settings
    label: Data
    url: /settings/data
    lifecycle: soon
    spa: false

  # ── HUB (landing only — per-korner nodes live in their manifests) ─
  - id: hub.landing
    bucket: hub
    label: Hub grid
    url: /hub
    lifecycle: live
    spa: true

  # ── Per-limb settings (see docs/kronk_settings_ia.md). The personal/account
  # settings live in the `settings` bucket above; a space configures itself in
  # its own limb — Feed's display prefs hang off the feed limb, the Hub's tile
  # prefs off the hub limb — so these two stay in feed/hub, not `settings`.
  - id: settings.feed
    bucket: feed
    label: Feed settings
    url: /home/settings
    lifecycle: live
    spa: true
  - id: settings.hub
    bucket: hub
    label: Hub settings
    url: /hub/settings
    lifecycle: live
    spa: true

  # ── KRONK (the organisation pillar, §O) ──────────────────────────────
  #
  # The org space is served by KronkController from markdown under
  # content/kronk/ (routes: `/kronk/:page`); the ЖЯѺƝ₭ wordmark links here.
  # These nodes put its real pages in the Kommons Directory so members can see and
  # plant proposals about how Kronk itself is run and built. `spa: true` skips
  # the route-name drift check — there is no per-page named Rails route (the
  # single `/kronk/:page` route serves them all), so there is nothing to bind.
  - id: kronk.about
    bucket: kronk
    label: About Kronk
    url: /kronk
    lifecycle: live
    spa: true
  - id: kronk.how_it_works
    bucket: kronk
    label: How Kronk works
    url: /kronk/how-it-works
    lifecycle: live
    spa: true
  - id: kronk.values
    bucket: kronk
    label: Values & manifesto
    url: /kronk/values
    lifecycle: live
    spa: true
  - id: kronk.governance
    bucket: kronk
    label: Governance
    url: /kronk/governance
    lifecycle: live
    spa: true
  - id: kronk.contributors
    bucket: kronk
    label: Contributors
    url: /kronk/contributors
    lifecycle: live
    spa: true
  - id: kronk.privacy
    bucket: kronk
    label: Privacy
    url: /kronk/privacy
    lifecycle: live
    spa: true
  - id: kronk.terms
    bucket: kronk
    label: Terms of service
    url: /kronk/terms
    lifecycle: live
    spa: true
  - id: kronk.rules
    bucket: kronk
    label: Rules
    url: /kronk/rules
    lifecycle: live
    spa: true
  - id: kronk.announcements
    bucket: kronk
    label: Announcements
    url: /kronk/announcements
    lifecycle: live
    spa: true
  - id: kronk.contact
    bucket: kronk
    label: Contact
    url: /kronk/contact
    lifecycle: live
    spa: true
