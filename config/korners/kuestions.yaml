# Kuestions — asking + answering
# Retroactively authored from the shipped code on `main`.

slug:            kuestions
name:            Kuestions        # rendered with Ƙ in nav
icon:            question_mark
render_target:   native
version:         2.0.0            # rework: dedicated Question + Answer models + visibility gate

permissions:
  - read:questions
  - write:questions

resources:
  - name:    questions
    primary: true                 # Question model (v2): dedicated table, title + prompt + status_id
  - name:    answers              # Answer model (v2): dedicated table, one row per (question, account)

storage:
  db_namespace:  question_        # tables: questions, answers (v2). Legacy post_type-based rows on
                                   # `statuses` continue to resolve during the transition; backfill
                                   # walks them into questions/answers on migration.
  media_prefix:  # not-implemented
  redis_prefix:  # not-implemented

visibility_scopes: []             # uses Mastodon visibility as-is

steward_role:    moderator

emits: []
listens: []

feed_projection:
  card:               question_card                # StatusQuestionCard, unified onto StatusKornerCard
  title_from:         title                        # Question#title (v2 model)
  summary_from:       prompt                       # Question#prompt — the body text
  links_to:           /hub/kuestions/<id>
  default_visibility: public

  status_association: question       # framework: Status.has_one :question via status_id (§5.5)
  status_post_type:   question       # legacy path; both resolve during the transition

notifications:
  types:
    - name:         question_answered
      subject_type: question
      default_push: true
      aggregation:  default
      interactive:  true             # nudge — reply-able
    - name:         answer_frothed
      subject_type: answer
      default_push: false
      aggregation:  { window: 1h, key: answer_id }
      interactive:  false            # notice — inline count in the answer's thread

launch:
  blurb:  "Kuestions — ask, answer, unlock."
  cta:    "Tap in"

feature_flag:    # not-implemented
federates:       false
enforced:        true                              # framework: on this branch; boot validator enforces
