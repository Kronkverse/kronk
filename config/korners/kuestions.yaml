# Kuestions — asking + answering
# Retroactively authored from the shipped code on `main`.

slug: kuestions
name: Kuestions # rendered with Ƙ in nav
purpose: 'To prompt kronkers to share by asking each other questions — turning curiosity into connection.'
icon: question_mark
render_target: native
version: 2.0.0 # rework: dedicated Question + Answer models + visibility gate

security:
  permissions:
    - read:questions
    - write:questions
  visibility_scopes: [] # uses Mastodon visibility as-is
  maintainers:
    - moderator
  federates: false

resources:
  - name: questions
    primary: true # Question model (v2): dedicated table, title + prompt + status_id
  - name: answers # Answer model (v2): dedicated table, one row per (question, account)

storage:
  db_namespace:
    question_ # tables: questions, answers (v2). Legacy post_type-based rows on
    # `statuses` continue to resolve during the transition; backfill
    # walks them into questions/answers on migration.
  media_prefix: # not-implemented
  redis_prefix: # not-implemented

emits:
  # Nudges listens for this to route to the asker's Mate chat with the answerer.
  - kuestions.question.answered
  # A Favourite lands on the Question's Status; Nudges routes to the asker.
  - kuestions.question.frothed
listens: []

feed_projection:
  card: question_card # Retired 2026-07-22 (Phase 3a) — StatusQuestionCard gone.
  # A dedicated `kuestions_card` per docs/spaces/kuestions.md §Feed
  # projection returns here backed by the Question model (Phase 8.3),
  # not the legacy Status-polymorphic path.
  title_from: title
  summary_from: prompt
  links_to: /hub/kuestions/<id>
  default_visibility: public

  status_association: question # framework: Status.has_one :question via status_id (§5.5)
  # `status_post_type: question` removed 2026-07-22 — no writer sets
  # post_type=question anymore; Kuestions v2 uses the dedicated
  # `questions` table exclusively.

notifications:
  types: []
  # question_answered + answer_frothed are deferred: no producers exist yet
  # (no answer-created or answer-froth hook wired to a notification). They
  # return here — with producers — when Kuestions v2 delivery ships. The L10
  # gate requires a declared type to be registered + fired (§5.7).

# Per-user settings surfaced at /hub/kuestions/settings (spec §K.3.3).
settings:
  - name: default_answer_visibility
    kind: enum
    options: [public, unlisted, followers]
    default: public
    scope: user
    label: Default visibility for my answers
  - name: hide_answered_questions
    kind: boolean
    default: false
    scope: user
    label: Hide questions I've already answered
    description: When on, the Kuestions feed filters out anything you've locked in an answer for.
  - name: unlock_confirmation
    kind: boolean
    default: true
    scope: user
    label: Confirm before answering
    description: Answering unlocks other people's answers. When on, we ask for confirmation so you don't burn the unlock by accident.
  - name: daily_prompt_in_post_box
    kind: boolean
    default: true
    scope: user
    label: Daily prompt in my post box
    description: Kronk sets one prompt a day — the same for everyone. It sits faint in your composer as a starting point; your reply is a normal post.

compose:
  label: 'Ask a Kuestion'
  # Reuses the same Kuestions shell — the component opens on the Ask
  # panel when the pathname ends `/ask`. Deep-linkable so the Ӂ menu's
  # Post can drop the user straight into the composer regardless of
  # which panel they were on last.
  route: '/hub/kuestions/ask'

launch:
  blurb: 'Kuestions — ask, answer, unlock.'
  cta: 'Tap in'

feature_flag: # not-implemented
enforced: true # framework: on this branch; boot validator enforces

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: kuestions.index
    label: Kuestions
    url: /hub/kuestions
    lifecycle: live
    spa: true
  - id: kuestions.detail
    label: A question
    url: /hub/kuestions/:id
    lifecycle: live
    spa: true
