# Kalendar — events, RSVPs, invitations
# Retroactively authored from the shipped code on `main`.

slug: kalendar
name: Kalendar
purpose: "To hold Kronk's shared time — the events and gatherings a community organises around."
icon: calendar_month
render_target: native
version: 0.1.0

security:
  permissions:
    - read:statuses
    - write:statuses
  visibility_scopes: []
  maintainers:
    - moderator
  federates: false

resources:
  - name: events
    primary: true
  - name: event_invitations
  - name: event_rsvps

storage:
  db_namespace: event_ # tables: events, event_invitations, event_rsvps
  media_prefix: # not-implemented — event cover images use Mastodon's default paperclip attachment paths
  redis_prefix: # not-implemented

emits:
  # Framework event-bus emissions (§6 inter-korner). Huddle listens
  # for this to attach event metadata to its sessions.
  - name: kalendar.event.created
    payload:
      - event_id
      - account_id
      - event_type
      - huddle_session_id
  # notification.event_invitation dispatches via the Mastodon
  # notification system rather than the korner event bus; documented
  # here for discoverability of Kalendar's outbound signals.
  - notification.event_invitation
  # Nudges listens for this to route to the event creator's Mate chat.
  - name: kalendar.event.rsvpd
    payload:
      - actor_account_id
      - recipient_account_id
      - event_id
      - status
listens: []

feed_projection:
  card: event_card # StatusEventCard; not yet ported onto StatusKornerCard
  title_from: title
  summary_from: location # combines with start_time in the card layout
  links_to: /kalendar/<id> # existing; §4 migration → /hub/kalendar/events/<id>
  default_visibility: public
  discriminator: status.event.present? # via Status.has_one :event, inverse of Event.status_id

  status_association: event # framework: Status.has_one :event
subscription:
  default: off # not-implemented

# Per-user settings surfaced at /hub/kalendar/settings (spec §K.3.3).
settings:
  - name: reminder_lead_time
    kind: duration
    default: PT1H
    options: [PT15M, PT30M, PT1H, PT4H, P1D]
    scope: user
    label: Event reminder lead time
    description: How far ahead of an event you're going or interested in the reminder fires.
  - name: default_event_visibility
    kind: enum
    options: [public, unlisted, private]
    default: public
    scope: user
    label: Default event visibility
    description: Fresh events you create start at this visibility. You can override per-event.
  - name: week_start
    kind: enum
    options: [monday, sunday]
    default: monday
    scope: user
    label: Week starts on

compose:
  label: 'New event'
  route: '/hub/kalendar/new'

launch:
  blurb: 'Kalendar — the shared calendar for Kronk.'
  cta: 'Tap in'

feature_flag: # not-implemented
enforced: true # framework: on this branch; boot validator enforces

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: kalendar.index
    label: Kalendar
    url: /hub/kalendar
    lifecycle: live

  - id: kalendar.event
    label: Event detail
    url: /hub/kalendar/:id
    lifecycle: live
    spa: true
    links:
      - to: wachuneed.index
        kind: creates
        description: Events can list tickets on Wachuneed.
      - to: huddle.index
        kind: related
        description: Huddles are scheduled through Kalendar and emit calendar events.
