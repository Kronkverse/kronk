# Profile — a person's space at /@:acct. A core platform space, not a korner.
#
# Manifest-declared per the one-mechanism decision (docs/decisions.md).
# Profile rides Mastodon's core Account model plus the Kronk sectioned-profile
# layer (profile_sections); it owns no korner-namespaced tables.

slug: profile
name: Profile
purpose: 'To let you shape how you show up on Kronk — your presence, your sections, your story.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: "Your profile is your space on Kronk: who you are, what you've posted, and who your Mates are."
  why: 'So you can shape how you show up, and choose who sees what.'
  how:
    - 'Tap Design your profile in the Ж menu to change your photo, cover, name and bio right where they sit.'
    - 'Answer profile Kuestions to say who you are, and choose which spaces get a shelf.'
    - 'Tap See it as others do to check what your Mates, your Orbit and all of Kronk can see.'
    - 'Turn to Timeline for your posts, and to Mates for your Mates.'
    - "On someone else's profile, you can ask to be Mates, Nudge them, send a rose, or post on their profile."
icon:
  material: taunt
render_target: native
version: 0.1.0

security:
  permissions:
    - read:accounts
  visibility_scopes: [] # account/status visibility governs what a viewer sees
  maintainers:
    - moderator
  federates: true # accounts federate

resources: [] # rides the core Account model + profile_sections; no korner tables

storage:
  db_namespace: # not-applicable — core accounts table
  media_prefix: # not-applicable — avatar/header use Mastodon media
  redis_prefix: # not-applicable

# Mates live on the profile (its Mates face).
emits:
  - mates.request.sent # Mates::RequestService
  - mates.request.accepted # Mates::AcceptService
listens: []

feed_projection:
  card: # not-applicable — the profile is a destination, not a feed card
  discriminator: # n/a

subscription:
  default: # not-applicable — following, not subscription, is the profile primitive

launch:
  blurb: # not-applicable — core space, no launch card
  cta: # not-applicable

feature_flag: # not-implemented
# Profile is a core space, not a korner: it is the "Me" pillar of the primary
# switcher, has no Hub tile, and cannot be tuned out of.
core: true
mount: /@:acct
enforced: true

# Nodes are the cross-cutting profile.* entries in config/kronk_nodes.yaml.
nodes: []
