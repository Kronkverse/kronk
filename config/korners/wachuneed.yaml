# Wachuneed — art, stuff, and offerings traded person-to-person.
# Greenfield reference korner: built to spec §5 from day one —
# canonical status_id linkage, dedicated tables, no retrofitting.
#
# Naming history:
#   - marketplace  (initial)
#   - wachuneed    (2026-07-21 rename)
#   - mARTketplace (2026-07-24 — display name only)
#   - martketplace (2026-07-24 — URL slug rename)
#   - wachuneed    (2026-09-07 — full return: slug + name + URL flip
#                   back to the community-vocab name. `martketplace`
#                   goes to reserved_slugs for the 301 window.)

slug: wachuneed
name: Wachuneed
purpose: 'To let kronkers offer, find and ask for art, stuff, and offerings person-to-person.'
tagline: 'Wachuneed? Wachugot?? See what people are selling — and share what you have.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: "Where members offer and ask for things: art they make, stuff they're passing on, and services they offer."
  why: 'Trust comes from being in the same community. Wachuneed helps you find what you need from the people around you.'
  how:
    - 'Browse everything on one page: shops along the top, then what is offered and what people want. Narrow it to Offered or Wanted.'
    - 'List something from the Ж menu, or post a wanted ad.'
    - 'Message the poster in Nudges to sort it out. Kronk handles no payment; you agree that between you.'
    - 'Under Mine: what is waiting on you, work you are doing, your wanted ads, what you sell (and your shop), and what you bought. If you sell what you make, open a shop there.'
    - 'Under Brands, back the brands whose mission you respect, or propose one.'
    - "Take a listing down once it's gone."
icon:
  material: kronk_coin
render_target: native
version: 2.0.0

security:
  permissions:
    - read:listings
    - write:listings
    - read:statuses # reuses Mastodon's read scope for public listings
    - write:statuses # reuses for creating a shared Status per listing
  # Kronk reach ladder (docs/spaces/feed.md (The reach ladder)). Corrected
  # 2026-09-13 — was carrying pre-2.0 Mastodon terms (followers /
  # friends_of_friends), which don't map to Kronk's social graph
  # (no follows; Mates + Orbit only).
  visibility_scopes:
    - public
    - orbit
    - mates
    - self_only
  maintainers:
    - moderator
  federates: false

resources:
  - name: listings
    primary: true
    path: /hub/wachuneed/listings/:id
  - name: listing_photos
  - name: listing_offers
  - name: listing_shops
  - name: listing_shop_sections
  # Brands members back (docs/spaces/wachuneed.md, Brands).
  - name: wachuneed_brands
    path: /hub/wachuneed/brands/:id
  - name: wachuneed_brand_backings

storage:
  db_namespace: listing_ # tables: listings, listing_photos, listing_offers, listing_shops, listing_shop_sections (and wachuneed_brands, wachuneed_brand_backings)
  media_prefix: spaces/wachuneed/
  redis_prefix: 'wachuneed:'

emits:
  - wachuneed.listing.published
  - wachuneed.listing.reserved
  - wachuneed.listing.closed
  - wachuneed.offer.made
  - wachuneed.offer.accepted
  - wachuneed.offer.declined # seller declines a buyer's offer; Nudges routes to buyer
  - wachuneed.offer.cancelled # either side calls an accepted booking off; Nudges routes to the other
  - wachuneed.pitch.made # someone answers a wanted ad; Nudges routes to its poster
  - wachuneed.pitch.chosen # the poster chooses an answer; Nudges routes to whoever answered
  - wachuneed.pitch.passed # an answer not chosen (no thanks, or the ad was taken); to whoever answered
  - wachuneed.pitch.delivered # whoever was chosen marks it delivered; to the poster
  - wachuneed.pitch.done # the poster marks it done; to whoever did it
  - wachuneed.brand.listed # a proposed brand reached its backers; Nudges routes to the proposer

listens: []

# Cross-korner attachments (docs/korners/adding_a_korner.md (Korner attachments)).
# Wildcard link — a Wachuneed listing can be linked from any source
# korner. Killer flow: a Kalendar event for a sale attaches the
# listings it's selling. Owner consent enforced at API-time by
# KornerAttachmentPolicy.
accepts:
  - from: '*'
    kind: link

attaches:
  # Any record here can be linked to anything that takes links, by whoever
  # looks after it (decisions.md, 2026-10-21).
  - to: '*'
    kind: link
    trigger: user
    lifecycle: keep

feed_projection:
  card: wachuneed_card
  title_from: title
  summary_from: description
  status_association: listing # framework: Status.has_one :listing via status_id (§5.5)
  links_to: /hub/wachuneed/listings/<id>
  default_visibility: public

notifications:
  types: []
  # All four listing_* types are deferred: Wachuneed has no notification
  # producers (and its subject_types listing/listing_offer are not yet wired to
  # delivery). They return here — with producers — when Wachuneed notification
  # delivery ships. The L10 gate requires a declared type to be registered (§5.7).

settings:
  - name: default_publish_visibility
    kind: enum
    options: [public, orbit, mates, self_only]
    default: public
    scope: user
  - name: notify_on_offer
    kind: boolean
    default: true
    scope: user
  - name: auto_close_after_days
    kind: integer
    default: 90
    scope: user

# Konnect (decisions.md, 2026-10-23; docs/korners/adding_a_korner.md,
# Korner attachments §2.6): this korner's Konnections and how they work.
konnect:
  # Where it Konnects (the Konnect grid, decisions.md 2026-11-08): its
  # kind, and per korner `space` (turns a section on there) or `link`
  # (ties one record). A pair is offered when either side lists the
  # other; anything else is refused.
  kind: exchange
  to:
    krew: link
    freethedream: link
    # A ticketed listing's dates are Kalendar events, Konnected to it
    # (Tal, 2026-11-09: tickets are "both, linked").
    kalendar: link
  # What one of its records is called wherever Kronk names it beside
  # its title ("the Ember event"), so records that share a title can be
  # told apart (decisions.md, 2026-10-26).
  noun: listing
  # The Konnect picker can make a new one from anywhere: "New …" opens
  # `compose.route` with `?konnect=<source slug>:<source id>`, and the
  # composer Konnects what it makes to that source.
  make: true

compose:
  label: 'New listing'
  route: '/hub/wachuneed/new'

hub_teaser:
  static: 'Wachuneed — art, stuff, and offerings from the community.'

# SpaceNav view switcher (first entry = default, bare /hub/wachuneed).
# Three faces on the rotator (Tal 2026-11-16: everything on one page,
# Brands, and your own). Offered, Desired, Shops and Requests were faces
# of their own until then and redirect (config/routes.rb).
#
#   /hub/wachuneed         → home    (titled Wachuneed, not All: Tal,
#                                       2026-11-17; shops along the top,
#                                       then everything
#                                       offered and wanted in one grid,
#                                       ?show=offered|wanted narrows it)
#   /hub/wachuneed/mine    → mine    (your jobs, what you sell and buy,
#                                       your shop)
#   /hub/wachuneed/brands  → brands  (brands members back; Proposed ones
#                                       too; last since 2026-11-16, Tal)
views:
  - {
      key: home,
      label: Wachuneed,
      tagline: 'Shops, and everything offered and wanted.',
    }
  - {
      key: mine,
      label: Mine,
      tagline: 'Your jobs, what you sell and buy, and your shop.',
    }
  - {
      key: brands,
      label: Brands,
      tagline: 'Brands whose mission members back.',
    }

header:
  rotator: true

launch:
  blurb: 'Wachuneed — art, stuff, and offerings from the Kronk community.'
  cta: 'Tap in'

feature_flag: # not-implemented — Wachuneed ships enabled at 2.0.0
enforced: true # item 8: serializer (L3) + /hub/wachuneed mount (L5) shipped — conformant

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: wachuneed.index
    label: Wachuneed
    url: /hub/wachuneed
    lifecycle: live
    spa: true
    links:
      - to: kalendar.index
        kind: listens_to
        description: Event ticket listings originate in Kalendar.
  # Standard L6: a node for every page someone can navigate to.
  - id: wachuneed.brands
    label: Brands
    url: /hub/wachuneed/brands
    lifecycle: live
    spa: true
  - id: wachuneed.mine
    label: Mine
    url: /hub/wachuneed/mine
    lifecycle: live
    spa: true
