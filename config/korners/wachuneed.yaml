# Wachuneed — art, stuff, and offerings traded person-to-person.
# Greenfield reference korner: built to spec §5 from day one —
# canonical status_id linkage, dedicated tables, no retrofitting.
#
# Naming history:
#   - marketplace  (initial)
#   - wachuneed    (2026-07-21 rename)
#   - mARTketplace (2026-07-24 — display name only)
#   - martketplace (2026-07-24 — URL slug rename)
#   - wachuneed    (2026-09-07 — full return: slug + name + URL flip
#                   back to the community-vocab name. `martketplace`
#                   goes to reserved_slugs for the 301 window.)

slug: wachuneed
name: Wachuneed
purpose: 'To let kronkers offer and find art, stuff, and offerings person-to-person.'
tagline: 'Wachuneed? Wachugot?? See what people are selling — and share what you have.'
icon:
  material: kronk_coin
render_target: native
version: 2.0.0

security:
  permissions:
    - read:listings
    - write:listings
    - read:statuses # reuses Mastodon's read scope for public listings
    - write:statuses # reuses for creating a shared Status per listing
  visibility_scopes:
    - public
    - followers
    - friends_of_friends
  maintainers:
    - moderator
  federates: false

resources:
  - name: listings
    primary: true
  - name: listing_photos
  - name: listing_offers

storage:
  db_namespace: listing_ # tables: listings, listing_photos, listing_offers
  media_prefix: spaces/wachuneed/
  redis_prefix: 'wachuneed:'

emits:
  - wachuneed.listing.published
  - wachuneed.listing.reserved
  - wachuneed.listing.closed
  - wachuneed.offer.made
  - wachuneed.offer.accepted
  - wachuneed.offer.declined # seller declines a buyer's offer; Nudges routes to buyer

listens: []

# Cross-korner attachments (docs/kronk_korner_attachments.md).
# Wildcard link — a Wachuneed listing can be linked from any source
# korner. Killer flow: a Kalendar event for a sale attaches the
# listings it's selling. Owner consent enforced at API-time by
# KornerAttachmentPolicy.
accepts:
  - from: '*'
    kind: link

feed_projection:
  card: wachuneed_card
  title_from: title
  summary_from: description
  status_association: listing # framework: Status.has_one :listing via status_id (§5.5)
  links_to: /hub/wachuneed/listings/<id>
  default_visibility: public

notifications:
  types: []
  # All four listing_* types are deferred: Wachuneed has no notification
  # producers (and its subject_types listing/listing_offer are not yet wired to
  # delivery). They return here — with producers — when Wachuneed notification
  # delivery ships. The L10 gate requires a declared type to be registered (§5.7).

settings:
  - name: default_publish_visibility
    kind: enum
    options: [public, followers, friends_of_friends]
    default: public
    scope: user
  - name: notify_on_offer
    kind: boolean
    default: true
    scope: user
  - name: auto_close_after_days
    kind: integer
    default: 90
    scope: user

compose:
  label: 'New listing'
  route: '/hub/wachuneed/new'

hub_teaser:
  static: 'Wachuneed — art, stuff, and offerings from the community.'

# SpaceNav view switcher (first entry = default, bare /hub/wachuneed).
# Two faces — Wachuneed (browse others' listings, the default landing)
# and Wachugot (your own listings + new-listing entry point). Rotator
# treatment: the h1 cycles Wachuneed / Wachugot as the user rotates
# faces, same standard the other rotator korners use (Kommons, Booth,
# Kalendar, Kommunity, Krew, Map, Albutts, Kuestions).
#
#   /hub/wachuneed          → wachuneed (browse others' listings)
#   /hub/wachuneed/wachugot → wachugot  (the caller's own listings)
views:
  - {
      key: wachuneed,
      label: Wachuneed,
      tagline: 'See what people are selling.',
    }
  - {
      key: wachugot,
      label: Wachugot,
      tagline: "What you've got listed — and where you list something new.",
    }

header:
  rotator: true

launch:
  blurb: 'Wachuneed — art, stuff, and offerings from the Kronk community.'
  cta: 'Tap in'

feature_flag: # not-implemented — Wachuneed ships enabled at 2.0.0
enforced: true # item 8: serializer (L3) + /hub/wachuneed mount (L5) shipped — conformant

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: wachuneed.index
    label: Wachuneed
    url: /hub/wachuneed
    lifecycle: live
    spa: true
    links:
      - to: kalendar.index
        kind: listens_to
        description: Event ticket listings originate in Kalendar.
