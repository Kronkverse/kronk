# YOU — Your Own Universe.
#
# A gamified personal-growth PWA (Kashka's project — repo:
# Kashka-25/you-app-build). Users manage their values, streaks,
# avatar, Memory Bank, mood, and astrology guidance in YOU.
#
# In Kronk's architecture, YOU is a *pod client* — one of what will
# eventually be many client applications sitting on top of the Anthemos
# personal-pod infrastructure. YOU is the first schema-authoring
# client; Kronk is a social-fabric consumer of the same pod via the
# membrane (see docs/rebuild/kronk-anthemos-architecture memory).
#
# For 2.0 the integration is deliberately shallow: `/hub/you` renders
# a landing card that links out to YOU's Netlify-hosted PWA. Deeper
# integration (shared auth via Anthemos, projected profile fields,
# Kronk-side surfacing of YOU signals) lands in later phases once
# Anthemos + its membrane are stable.
#
# `enforced: false` keeps the boot validator quiet — no Kronk-side
# models, no feed projection card. Just a routed entry point.

slug: you
name: YOU
icon: self_improvement # material-icons "self_improvement" — meditative figure
render_target: native
version: 0.0.0
enforced: false

# No local resources — YOU's data lives in the user's pod, not Kronk.
resources: []

storage:
  db_namespace: # not-applicable — no Kronk-side tables
  media_prefix: # not-applicable — media lives in the pod
  redis_prefix: # not-applicable

# Canonical nested security block (Standard §L1). YOU holds no Kronk-side
# data — permissions/visibility live in the user's pod — so this is minimal.
security:
  visibility_scopes: [] # no Kronk-side visibility gating — data is in the pod
  maintainers: [moderator] # steward role for the integration itself
  federates: false # YOU does not federate; signals surface via the membrane later

# No cross-korner emits yet. Once Anthemos membrane is live, YOU may
# publish "value updated" / "level up" / "mood logged" events that
# other Kronk korners can react to.
emits: []
listens: []

# No feed projection in 2.0 — YOU signals surface in the profile
# space (per docs/prototypes/kronk-profile-redesign.html), not the
# main feed. Wire the projection card in a later phase.
feed_projection:
  card: # not-implemented yet
  title_from: # not-applicable
  status_association: # not-applicable
  links_to: /hub/you

# Nodes for the Kommons Tree — one entry point node so users can
# leave feedback on the YOU integration itself.
nodes:
  - id: you.index
    bucket: hub
    parent: you
    label: YOU home
    url: /hub/you
    lifecycle: soon # shallow link-out stub for 2.0 (Standard §L6 / §1 gate)

# Landing card content — surfaced by the shared korner-stub renderer
# or the dedicated YouPortal feature.
hub_teaser:
  static: 'Your Own Universe — track values, grow your Seed Being, log memories, and follow your kosmic rhythms.'

launch:
  blurb: "YOU is Kronk's first pod client — a self-facing app for personal growth. Sign in and start shaping your identity."
  cta: 'Open YOU'
