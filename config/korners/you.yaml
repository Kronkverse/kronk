# YOU — portal to Your Own Universe.
#
# This korner is a *portal* — a Kronk-native entry point that links
# out to YOU (Kashka's personal-growth PWA, repo
# Kashka-25/you-app-build). The Kronk-side stays a portal by design:
# YOU keeps its own aesthetic + surface on its own domain, and Kronk
# just hosts the discoverable route into it. Deeper wiring (shared
# auth via Anthemos, YOU signals projected into Kronk's profile) will
# land at the auth/data layer via the Anthemos membrane, not by
# absorbing YOU into Kronk.
#
# Because this korner is portal-only (no Kronk-side models, no feed
# projection, no data), it stays at lifecycle `soon` / `enforced:
# false` under `docs/korners/korner_standard.md` §1 permanently — a
# link-out doesn't own the resources an enforced korner is required
# to declare.

slug: you
name: YOU
tagline: 'Your Own Universe, a place to peer into the mirror and see yourself.'
icon: star # kosmic four-point star — matches "Your Own Universe" framing;
# useKornerIcon.tsx wires slug 'you' → StarIcon accordingly. (The
# original preference was `self_improvement`, which isn't in the
# shipped material-icons set — substituted per the same pattern
# huddle/klot/tree use for unshipped icons.)
render_target: native
version: 0.1.0
enforced: false

# No local resources — YOU owns its own data (currently in Supabase;
# eventually in an Anthemos pod). Kronk stores nothing on YOU's behalf.
resources: []

storage:
  db_namespace: # not-applicable — no Kronk-side tables
  media_prefix: # not-applicable — media lives in YOU / the pod
  redis_prefix: # not-applicable

# Canonical nested security block per Korner Standard §L1.
security:
  permissions: [] # no Kronk-side capabilities; auth is YOU's / Anthemos's
  visibility: public # portal is publicly discoverable in /hub
  federation: none # portal is intra-Kronk; YOU handles its own federation posture
  maintainers: moderator # only Kronk admins can flip the portal itself

# No cross-korner emits or listens. Portal is a static route.
emits: []
listens: []

# No feed projection — YOU signals will appear in the profile space
# via the Anthemos membrane once it lands, not as feed cards.
feed_projection:
  card: # not-applicable — portal only
  title_from: # not-applicable
  status_association: # not-applicable
  links_to: /hub/you

# One Tree node so users can leave Kommons feedback on the portal itself.
# lifecycle: soon per Korner Standard §L6 (matches enforced: false).
nodes:
  - id: you.index
    bucket: hub
    parent: you
    label: YOU home
    lifecycle: soon
    url: /hub/you

# Landing card content — surfaced by the dedicated YouPortal feature.
hub_teaser:
  static: 'Your Own Universe — track values, grow your Seed Being, log memories, and follow your kosmic rhythms.'

launch:
  blurb: 'YOU is a self-facing personal-growth companion — its own app, in its own aesthetic. Kronk provides the door in.'
  cta: 'Open YOU'
