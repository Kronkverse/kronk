# Map — opt-in presence and location. Who's around, if they choose
# to say. Every share is a deliberate act; nothing is broadcast unless
# the user flips a toggle each session.
#
# Ships in 2.0.0 as a prototype-driven surface at /hub/map (Kommons
# proposal #116969555027300161 "New Korner: Map — To see where your
# mates are and share activities"). The frontend view is the
# hand-authored prototype iframed via features/map_v2/. Backend
# (presence_states + real-time infra) still to build — this manifest
# stays enforced so the tile lights up on the Hub, but the surface is
# read-only until wiring lands.

slug: map
name: Map
purpose: "To let people signal presence on their own terms — who's around, only if they choose to say."
tagline: 'Allow yourself to be found, know where your mates are & explore the world.'
icon:
  material: travel_explore
  # No text_glyph — Map isn't K-branded, so the badge falls back to its
  # name's first letter ("M") rather than a stylised Kra letterform.
render_target: native
version: 0.0.0

resources:
  - name: presence_states
    primary: true

storage:
  db_namespace: presence_ # planned; may become Redis-only depending on retention
  media_prefix: spaces/map/

feed_projection: # no feed projection — presence is not a feed item
  card: null

settings:
  - name: default_share_scope
    kind: enum
    options: [none, friends, groups, kommunity]
    default: none
    scope: user
  - name: auto_expire_minutes
    kind: integer
    default: 60
    scope: user

emits: []
listens: []

# Three lenses on the same surface. Frame-provided pill nav switches
# between them via /hub/map, /hub/map/treks and /hub/map/logger; the
# iframe listens for the change and swaps its lens without reloading.
views:
  - { key: mates, label: Mates }
  - { key: treks, label: Treks }
  - { key: logger, label: Logger }

hub_teaser:
  static: "Who's around, if they choose to say."

launch:
  blurb: 'Map — opt-in presence. Nothing shared unless you choose to.'
  cta: 'Peek in'

enforced: true

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: map.index
    label: Map
    url: /hub/map
    lifecycle: soon
    spa: true
