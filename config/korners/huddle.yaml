# Huddle — live video sessions. Own korner, peer-connected to Kalendar
# via events.huddle_session_id. Both can exist independently; the FK
# is optional.
#
# See docs/korners/adding_a_korner.md (Framework spec (v0.5)) §Huddle and delta rollup I4.

slug: huddle
name: Huddle
tagline: 'Huddle up!'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: 'Live video rooms for being together: drop in, chat, work side by side. Not a meeting, not a livestream.'
  why: 'Sometimes being there beats a thread. Huddle is a room to be in together, and nothing is recorded or kept.'
  how:
    - "Tap Huddle Up to join the Main Huddle. It's always open, and everyone's welcome."
    - 'Keep the Main Huddle going in a small window while you move around Kronk.'
    - 'Or tap a Kuddle to drop into it. Kuddles are open topics anyone can join.'
    - 'Make a new Kuddle from the Ж menu: a name and a line about it. You can Konnect it to a Krew of yours, and it shows on their page.'
    - "Tap Unhuddle when you're done."
purpose: 'To give Kronk a room to be in together — live video for when presence beats a thread.'
icon:
  material: diversity_2
render_target: native
version: 2.0.0 # split from Kalendar in the rebuild

resources:
  - name: huddle_sessions
    primary: true
    path: /hub/huddle/kuddle/:id # a Room is a Kuddle to people; /room/:id redirects
  - name: huddle_participants

storage:
  db_namespace: huddle_ # tables: huddle_sessions, huddle_participants
  media_prefix: spaces/huddle/

security:
  permissions:
    - read:huddles
    - write:huddles # opening a Room, joining a session
  # Huddles are open or Krew-scoped — there are no free-form private
  # ones (docs/spaces/huddle.md § Three categories). Main and Rooms are
  # `public`: anyone can join, no membership, no invite, no gating. Krew
  # Huddles are `krew`: visible and joinable only to that Krew's members.
  visibility_scopes: [public, krew]
  # Korner-level maintenance only. It is deliberately NOT the in-session
  # role: Huddle has no host, and every participant in a session holds the
  # same moderation powers (docs/spaces/huddle.md § Moderation — flat and
  # distributed).
  maintainers:
    - moderator
  federates: false

# Ж-menu compose action. Any signed-in user can open a new open
# Room ("New Kuddle": people call Rooms Kuddles) (see docs/spaces/huddle.md § Three categories); the create
# affordance lives on the floating Kronk menu per the Korner
# Standard (docs/korners/adding_a_korner.md §11.5 — "Never build a
# per-page 'Add' / 'New X' / 'Create' button"). Route mounts the
# Huddle shell with `autoOpenComposer`, which opens RoomComposer in the
# shared <ComposeShell>. Opened with `?konnect=<slug>:<id>` (or the older
# `?krew=<id>`), RoomComposer Konnects the Room to that record through
# useKonnect, and a Krew's keys the draft to it. Creating goes straight
# into the new Room's call; cancelling goes back to the record it was
# opened from, or to `/hub/huddle`. `/hub/huddle/new` redirects here.
# Konnect (decisions.md, 2026-10-23): a Konnection with a Room is only the
# link.

# Konnect (decisions.md, 2026-10-23; docs/korners/adding_a_korner.md,
# Korner attachments §2.6): this korner's Konnections and how they work.
konnect:
  # What one of its records is called wherever Kronk names it beside
  # its title ("the Ember event"), so records that share a title can be
  # told apart (decisions.md, 2026-10-26). A Room is a Kuddle to the people
  # using it (decisions.md, 2026-10-27); the code still says room.
  noun: Kuddle
  # The Konnect picker can make a new one from anywhere: "New …" opens
  # `compose.route` with `?konnect=<source slug>:<source id>`, and the
  # composer Konnects what it makes to that source.
  make: true

compose:
  label: 'New Kuddle'
  route: '/hub/huddle/composer'

feed_projection:
  card: huddle_card
  planned: true # backend unbuilt — no session create/projection path yet
  title_from: title
  summary_from: description
  status_association: huddle_session # framework: Status.has_one :huddle_session via status_id
  links_to: /hub/huddle/sessions/<id>
  default_visibility: public

notifications:
  types:
    - name: huddle_starting
      planned: true # no producer yet — L10 tracks this as a warning
      subject_type: huddle_session
      default_push: true
      aggregation: none
      interactive: true # nudge — T-5min for scheduled sessions
    - name: huddle_participant_joined
      planned: true # no producer yet — L10 tracks this as a warning
      subject_type: huddle_session
      default_push: false # host-only, potentially noisy
      aggregation: { window: 5m, key: huddle_session_id }
      interactive: false # notice
    - name: huddle_ended
      planned: true # no producer yet — L10 tracks this as a warning
      subject_type: huddle_session
      default_push: false
      aggregation: none
      interactive: false

# Fomo noto (Kommons, 2026-10-21): "People are huddling" once the Main
# Huddle has this many in it, and the same for each Kuddle you follow
# (2026-10-27, its own row huddle.kuddle_gathering). Read by Huddle::FomoNotifier (its
# DEFAULT_THRESHOLD matches `default`). The nudge is made outright, not on
# the bus, so like Albutts' hand-wired ones it isn't under `notifications:`;
# its row (Nudges::MuteCatalogue, huddle.gathering) has the switches that
# turn it off. Two earlier settings here (auto_join_notifications,
# notify_when_someone_joins_my_huddle) were read by nothing and went.
settings:
  - name: fomo_threshold
    kind: integer
    default: 1
    min: 1
    max: 35
    scope: user
    label: Tell me when this many are huddling
    description: In the Main Huddle and the Kuddles you follow. Once per gathering; the switches above turn it off.

emits:
  - huddle.started
  - huddle.ended
  - huddle.participant.joined
  # Room lifecycle (open topical Rooms — see docs/spaces/huddle.md
  # § Three categories, Rebuild vision). Rooms are the third scope
  # alongside Main and Krew; created by any signed-in user, retired
  # by the reaper after 6 continuous months of no session activity.
  - huddle.room.created
  - huddle.room.retired

listens:
  # `kalendar.event.created` is a historical marker — Huddle no longer
  # subscribes to it. The Kalendar → Huddle link lives in
  # `korner_attachments` as of Phase 6 (docs/korners/adding_a_korner.md (Korner attachments)
  # 2026-08-15); the primitive replaces the ad-hoc "attach event
  # metadata to session" pattern that the bus event was going to power.
  - kalendar.event.created

# Cross-korner attachments (docs/korners/adding_a_korner.md (Korner attachments)). Huddle
# accepts `link` attachments from Kalendar — a scheduled event points
# at the Huddle Session it opens into. `events.huddle_session_id` FK is
# the passive mirror during the transition (Phase 6b drops it).
accepts:
  # Wildcard link — Kalendar events, Albutts album launches, Kommons
  # proposals discussed in-room, Booth sets to play during, etc.
  - from: '*'
    kind: link

attaches:
  # Any record here can be linked to anything that takes links, by whoever
  # looks after it (decisions.md, 2026-10-21).
  - to: '*'
    kind: link
    trigger: user
    lifecycle: keep

hub_teaser:
  static: 'The Huddle and its Kuddles: open the door and drop in.'

launch:
  blurb: 'Huddle — live video, when it makes sense to be in the room together.'
  cta: 'Peek in'

enforced: true # live surface at /hub/huddle (Phase 1). Session API +
# the huddle_card feed adapter land in Phase 2; Status.has_one
# :huddle_session and the huddle_ tables already exist.
# `federates` now lives in the `security:` block above (same value).

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: huddle.index
    label: Huddle
    url: /hub/huddle
    lifecycle: live
    spa: true
    links:
      - to: kalendar.index
        kind: listens_to
        description: Huddle sessions surface in Kalendar as scheduled events.
