# Booth — DJ sets, mixes, audio-forward sharing
# Retroactively authored from the shipped code on `main`.

slug: booth
name: The Booth
purpose: 'To give Kronk a stage for music — DJ sets and mixes shared as living sound.'
tagline: 'Shared self expression through the magic of audial art.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: "Kronk's stage for music: DJ sets, mixes, tracks and readings, recorded to be listened to."
  why: 'Music made by people on Kronk should be heard by the people around them. The Booth plays it and credits who made it.'
  how:
    - 'Upload a set from the Ж menu: the audio, a title, a cover and its genres. Credit anyone you made it with.'
    - 'Share it to your feed as you upload, or later from its page.'
    - 'Browse Musik, search by title or genre, or find someone under Artists.'
    - 'Press play and keep listening as you move around Kronk. Tap a time in the track list to jump to it.'
icon:
  material: headphones
render_target: native
version: 0.1.0

# The Kronk-standard title-as-view-switcher (docs/korners/korner_standard.md
# L11): the "Musik / Artists" pair cycles through the ScopeTitle chevrons on
# the title itself, and the Frame's separate segmented pill self-hides
# (see components/auto_space_view_picker.tsx). One switcher per surface.
header:
  rotator: true

security:
  permissions:
    - read:statuses
    - write:statuses
  visibility_scopes: []
  maintainers:
    - moderator
  federates: false

resources:
  - name: booth_sets
    primary: true
    path: /hub/booth/sets/:id
  - name: booth_lives

storage:
  db_namespace: booth_ # tables: booth_sets
  media_prefix: # not-implemented — audio + cover use Mastodon media_attachments (paperclip); a spec-conformant
    # future would move Booth audio under spaces/booth/booth_sets/<id>/, but the size + range-request
    # streaming path (§5.5) already exists and works, so migration is scheduling, not architecture.
  redis_prefix: # not-implemented

emits:
  # A Favourite landed on the set's shared Status; Nudges routes to
  # the set creator's Mate chat with the frother.
  - booth.set.frothed
  # The uploader credited a Kronk account as an artist on a set; Nudges
  # tells that person, who can confirm it or come off it.
  - booth.set.tagged
  # Someone left a shoutout on a set; Nudges tells the set's owner.
  - booth.set.shouted
listens: []

# Cross-korner attachments (docs/korners/adding_a_korner.md (Korner attachments)). Booth
# accepts `link` attachments from Kalendar so a DJ can bind a recorded
# set to the event where they played. The reverse-direction FK
# (`booth_sets.event_id`) is preserved as a passive mirror during the
# transition; the KornerAttachment row is now the authoritative link.
accepts:
  # Wildcard link — any source korner can link to a booth set
  # (Kalendar event, Albutts album, Kommons proposal, …). Owner
  # consent enforced at API-time by KornerAttachmentPolicy.
  - from: '*'
    kind: link

attaches:
  # Any record here can be linked to anything that takes links, by whoever
  # looks after it (decisions.md, 2026-10-21).
  - to: '*'
    kind: link
    trigger: user
    lifecycle: keep

feed_projection:
  card: booth_card # StatusBoothCard — landed on feature/korner-cards
  title_from: title
  summary_from: artist_name
  links_to: /hub/booth/sets/<id> # BoothSetPage; /booth/sets/<id> is served too
  default_visibility: public
  discriminator: status.booth_set.present? # Status has_one :booth_set via booth_sets.status_id (shared_status_id dual-written until 2.1)

  status_association: booth_set # framework: Status.has_one :booth_set
subscription:
  default: off # not-implemented

# Per-user settings surfaced at /hub/booth/settings (spec §K.3.3).
# All three declarations (`autoplay_on_visit`, `cover_image_size`,
# `default_mix_visibility`) retired 2026-09-13 — declared here but
# no consumer read them anywhere in the app; the surface was an
# empty gesture. They return when Booth actually wires readers for
# them (and `default_mix_visibility` must land with the Kronk
# reach ladder [public, orbit, mates, self_only], not the pre-2.0
# Mastodon terms [public, unlisted, followers] it carried).
settings: []

compose:
  # One entry for both: the composer switches between Upload a set and
  # Go live (`/hub/booth/composer/live`).
  label: 'Upload or go live'
  # The Ж bubble opens the shared `<ComposeShell>` overlay on top of
  # the Booth landing (docs/decisions.md 2026-08-12).
  # `/hub/booth/new` still resolves to the same overlay as a legacy
  # alias so pre-shell bookmarks + Ж-menu targets keep working.
  route: '/hub/booth/composer'

# SpaceNav view switcher (first entry = default, bare /hub/booth).
# Only the surfaces that actually render live here — Events, Live and
# Me were declared before their views existed and shipped as
# "coming-soon" placeholders in the switcher, which read as broken
# nav. Live came back on 2026-10-13 with its surface (live sets on
# Huddle's Jitsi server); Events and Me return when they're built.
views:
  - {
      key: musik,
      label: Musik,
      tagline: 'Sets and mixes shared as living sound',
    }
  - { key: live, label: Live, tagline: 'Sets played live, now and coming up' }
  - {
      key: mine,
      label: My sets,
      tagline: 'Your sets, your live sets and what you saved',
    }
  - { key: artists, label: Artists, tagline: 'The people behind the sound' }

launch:
  blurb: 'The Booth — DJ sets and mixes at Kronk.'
  cta: 'Tap in'

feature_flag: # not-implemented
enforced: true # framework: on this branch; boot validator enforces

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: booth.index
    label: Booth home
    url: /hub/booth
    lifecycle: live
    spa: true
    links:
      - to: profile.view
        kind: listed_on
        description: Booth sets can be featured as a profile section.
  # `booth.set` removed 2026-09-10: a detail page is a template inside its
  # space, not a space of its own. One node per space a user can reach —
  # a proposal about it belongs to Booth.
