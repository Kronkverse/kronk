# Booth — DJ sets, mixes, audio-forward sharing
# Retroactively authored from the shipped code on `main`.

slug: booth
name: The Booth
purpose: 'To give Kronk a stage for music — DJ sets and mixes shared as living sound.'
tagline: 'Shared self expression through the magic of audial art.'
icon:
  material: headphones
render_target: native
version: 0.1.0

security:
  permissions:
    - read:statuses
    - write:statuses
  visibility_scopes: []
  maintainers:
    - moderator
  federates: false

resources:
  - name: booth_sets
    primary: true

storage:
  db_namespace: booth_ # tables: booth_sets
  media_prefix: # not-implemented — audio + cover use Mastodon media_attachments (paperclip); a spec-conformant
    # future would move Booth audio under spaces/booth/booth_sets/<id>/, but the size + range-request
    # streaming path (§5.5) already exists and works, so migration is scheduling, not architecture.
  redis_prefix: # not-implemented

emits:
  # A Favourite landed on the set's shared Status; Nudges routes to
  # the set creator's Mate chat with the frother.
  - booth.set.frothed
listens: []

feed_projection:
  card: booth_card # StatusBoothCard — landed on feature/korner-cards
  title_from: title
  summary_from: artist_name
  links_to: /booth/sets/<id> # existing
  default_visibility: public
  discriminator: status.booth_set.present? # Status has_one :booth_set via booth_sets.shared_status_id

  status_association: booth_set # framework: Status.has_one :booth_set
subscription:
  default: off # not-implemented

# Per-user settings surfaced at /hub/booth/settings (spec §K.3.3).
settings:
  - name: autoplay_on_visit
    kind: boolean
    default: false
    scope: user
    label: Auto-play the featured set when I open Booth
  - name: cover_image_size
    kind: enum
    options: [small, medium, large]
    default: medium
    scope: user
    label: Cover image size
  - name: default_mix_visibility
    kind: enum
    options: [public, unlisted, followers]
    default: public
    scope: user
    label: Default visibility for sets I upload

compose:
  label: 'Upload a set'
  # The Ж bubble opens the shared `<ComposeShell>` overlay on top of
  # the Booth landing (docs/rebuild/decisions.md 2026-08-12).
  # `/hub/booth/new` still resolves to the same overlay as a legacy
  # alias so pre-shell bookmarks + Ж-menu targets keep working.
  route: '/hub/booth/composer'

# SpaceNav view switcher (first entry = default, bare /hub/booth).
# Only the surfaces that actually render live here — Events, Live and
# Me were declared before their views existed and shipped as
# "coming-soon" placeholders in the switcher, which read as broken
# nav. Add them back when their surfaces are built.
views:
  - { key: musik, label: Musik }
  - { key: artists, label: Artists }

launch:
  blurb: 'The Booth — DJ sets and mixes at Kronk.'
  cta: 'Tap in'

feature_flag: # not-implemented
enforced: true # framework: on this branch; boot validator enforces

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: booth.index
    label: Booth home
    url: /hub/booth
    lifecycle: live
    spa: true
    links:
      - to: profile.sections
        kind: listed_on
        description: Booth sets can be featured as a profile section.
  - id: booth.set
    label: A booth set
    url: /hub/booth/sets/:id
    lifecycle: live
    spa: true
