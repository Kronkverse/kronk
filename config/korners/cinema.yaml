# Cinema — single-author korner for short films. Scaffolded 2026-09-09
# alongside Kronikles, as the Art korner narrowed to physical works.
# Full stack (model, controller, feed projection, composer, viewer)
# landed 2026-09-11.
#
# Video is a MediaAttachment uploaded via `POST /api/v1/media`; the
# film row references it by id. No transcoding — the uploaded MP4 is
# served as-is and played back via a plain HTML5 <video> element in
# the viewer.

slug: cinema
name: Cinema
purpose: 'To make space for short films — original work, from title card to end frame.'
tagline: 'Short films, from title card to end frame.'
icon:
  # Bespoke Kronk glyph, not a Material Symbol (see useKornerIcon.tsx
  # MATERIAL_TO_ICON). Shipped 2026-09-11; replaces the earlier
  # generic Material `movie`.
  material: cinema
render_target: native
version: 1.0.0

resources:
  - name: films
    primary: true

storage:
  db_namespace: film_ # primary table: `films`
  media_prefix: # not-applicable — video rides Mastodon's shared
    # MediaAttachment pipeline, so files live under the standard
    # `media_attachments/*` prefix rather than a Cinema-owned root.

security:
  # Four-tier reach ladder (docs/kronk_feed_and_reach.md §2). Krew is
  # not offered on Cinema in v1.
  visibility_scopes:
    - public
    - orbit
    - mates
    - self_only

feed_projection:
  card: cinema_card # Cinema::PublishFilm mints one Status per film on
  # create, stamped source_korner='cinema'. StatusCinemaCard reads
  # `status.film` (the summary payload) and renders a placeholder
  # poster + title + owner. Tapping the card opens the viewer.
  title_from: title
  status_association: film
  links_to: /hub/cinema/<id>
  default_visibility: public

notifications:
  types: [] # v1 ships no korner-specific nudges. Favourites + replies
  # on the film's feed card fire the standard Status notification
  # pipeline via the backing Status.

settings: []

# Cross-korner attachments (docs/kronk_korner_attachments.md).
accepts:
  - from: '*'
    kind: link

hub_teaser:
  static: 'Short films, from title card to end frame.'

launch:
  blurb: 'Cinema — short films, original work, from title card to end frame.'
  cta: 'Post a film'

# The Ж menu (floating bubble) picks this up automatically: while the
# viewer is anywhere under /hub/cinema, the bubble's Post action reads
# `label` + `route` here. Composer opens as an overlay on the
# directory (matching Art / Kronikles / Albutts).
compose:
  label: 'Post a film'
  route: '/hub/cinema/composer'

# Directory rotates through three faces (All / Mine / Mates') sharing
# one grid — reach-narrowing scopes over the same `visible_to`
# set. `header.rotator: true` opts the space title into the shared
# `<ScopeTitle>` rotator (Standard L11).
views:
  - { key: all, label: 'All films', tagline: 'Every film you can see' }
  - { key: mine, label: 'My films', tagline: "Films you've posted" }
  - { key: mates, label: "Mates'", tagline: 'Films your mates have posted' }
header:
  rotator: true

enforced: true # boot validator gates L1-L11 for cinema (2026-09-11)

# ── Directory nodes ──────────────────────────────────────────────
nodes:
  - id: cinema.index
    label: Cinema
    url: /hub/cinema
    lifecycle: live
    spa: true
