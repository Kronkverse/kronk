# Kommunity — the whole-Kronk follow graph, rendered as a 3D orb the
# user can spin, zoom, and explore. Every member is a node on a
# 150-socket Fibonacci sphere; every follow is a chord bowing through
# the interior. Sky is the graph, seen from outside.
#
# Ships in 2.0.0 alongside the ambient KronkKosmos background layer
# (`features/kosmos/`). Both views build on the same shared geometry
# (`features/kosmos/orb_geometry.ts`); Kommunity is the direct 3D
# view and Kosmos is its slow cross-section painted behind chrome.
#
# Data source: same `{ accounts, follows }` payload consumed by
# `useMatesOrb()`. Currently a bundled synthesised edge assignment
# against real production degrees from 2026-07-19; swaps to the live
# `/api/v1/kronk/kommunity/orb` endpoint when the Mates proposal
# (Kommons #116990859270976043) lands. See `docs/spaces/kommunity.md`.

slug: kommunity
name: Kommunity
purpose: 'To let people see Kronk as a whole — a living topology of who is connected to whom, drawn from the follow graph.'
tagline: 'The community, seen from inside.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: "Kronk's people, three ways: Discover, for finding people you don't know yet; Everyone, the whole list of people who chose to be visible, A to Z; and the Orb, everyone and their connections drawn as a sphere you can spin and explore."
  why: 'A timeline only shows your own corner. Kommunity shows the whole community from inside, and helps you find your next Mate.'
  how:
    - "Discover is where you start: people open to being found, your Mates' Mates, and people in your Krews."
    - 'Turn to Everyone for the whole list of people who chose to be visible, A to Z, with search.'
    - 'Turn to the Orb, then drag to spin it and pinch or scroll to zoom. Tap someone to light up their connections.'
    - "Send a Mate request from someone's card."
    - 'Choose who can find you in your privacy settings.'
icon:
  # 中 (zhōng) — "middle". A Kronk-drawn glyph, not a Material Symbol;
  # it ships in app/javascript/material-icons/400-24px/zhong.svg and is
  # wired into MATERIAL_TO_ICON in hooks/useKornerIcon.tsx, which is the
  # one place any korner icon is resolved.
  #
  # Replaces a `globe` stand-in that stood in for an unavailable
  # `diversity_3`. Both were placeholders; this is the intended mark.
  material: zhong
render_target: native
version: 2.0.0

security:
  permissions:
    - read:statuses
  visibility_scopes: []
  maintainers:
    - moderator
  federates: false # Kronk-local only — remote/federated accounts out of scope by design (Orb brief §Data)

resources: [] # No korner-owned models; reads accounts + follows

storage:
  db_namespace: # not-applicable — no korner tables
  media_prefix: # not-applicable
  redis_prefix: # not-implemented

emits: []
listens: []

feed_projection:
  card: # not-applicable — Kommunity is a topology view, not a poster
  discriminator: # n/a

subscription:
  default: # not-applicable — Kommunity is a browsing surface, not a broadcast source

hub_teaser:
  static: 'Kronk, from the inside.'

launch:
  blurb: 'Kommunity — a 3D orb of every member and every connection. Spin it, look inside.'
  cta: 'See the orb'

# The orb renders against a bundled synthesised edge assignment for
# now (real degrees, invented specific edges). Density and rhythm are
# already true to the community; specific chord identities become
# exact once the Mates endpoint lands. Marking `enforced: true` so
# the tile lights up on the Hub — the surface works end-to-end today.
enforced: true

# SpaceNav view switcher. First entry is the default (bare
# /hub/kommunity). Icons are text labels for now; picks in a
# follow-up per the pattern set with Kuestions (#1146).
#
#   discover the landing view: the three-layer drawer of people to
#            meet, each account's own `kommunity_discoverability`
#            (everyone/orbit/nobody) gating whether they appear.
#   everyone the whole alphabetical directory of people who chose to
#            be visible to the viewer, with search.
#   orb      the 3D graph view, last.
#
# Order per Tal's Kommons proposal "Landing Page" (#117483791865274639,
# 2026-10-26): "Kommunity landing page should be the 'Discover' page,
# the Orb should be last. Also having a straight up list should be a
# middle page". Was Orb first (the default) until then.
views:
  - {
      key: discover,
      label: Discover,
      tagline: 'People who chose to be findable',
    }
  - { key: everyone, label: Everyone, tagline: 'Everyone you can find, A to Z' }
  - { key: orb, label: Orb, tagline: 'Everyone, seen from inside' }
header:
  # Title itself cycles through Discover → Everyone → Orb with the shared
  # ScopeTitle rotator (same as /home, Map, Kalendar, Albutts,
  # Kommons). Tal 2026-08-19: bring the title selector into Kommunity.
  # Was `picker: menu` before this — the dropdown didn't read as a
  # switcher and buried the alternate view. AutoSpaceViewPicker bails
  # when `rotator: true` is set, so no double picker.
  rotator: true

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: kommunity.index
    label: Kommunity
    url: /hub/kommunity
    lifecycle: live
    spa: true
  # `kommunity.discover` was here. Discover is one of Kommunity's three views
  # (see `views:` above — Discover, Everyone and Orb), not a space of its own, and the
  # Directory carries one node per space: a proposal about Discover is a
  # proposal about Kommunity (Tal 2026-09-10).
