# Moments — ephemeral posts, gone by morning.
#
# WIP manifest — no backend yet. `enforced: false` keeps the boot
# validator quiet while the models + composer land during 2.x.
# See docs/kronk_korner_spec.md §New korners.

slug: moments
name: Moments
purpose: 'To make space for the ephemeral — posts that are gone by morning.'
tagline: "Moments make us who we are, and we're here to share the authentic us."
icon:
  material: hourglass
render_target: native
version: 0.0.0

resources:
  - name: moments
    primary: true

storage:
  db_namespace: moment_ # planned: moments, moment_views
  media_prefix: spaces/moments/ # planned — DO Spaces path root

feed_projection:
  card: moments_card
  planned: true # WIP korner — no backend yet
  title_from: caption
  status_association: moment
  links_to: /hub/moments/<id>
  default_visibility: followers

settings:
  - name: auto_expire_hours
    kind: integer
    default: 24
    scope: user
  - name: notify_on_view
    kind: boolean
    default: false
    scope: user

emits: []
listens: []

hub_teaser:
  static: 'Gone by morning.'

launch:
  blurb: "Moments — post something ephemeral. It's gone in 24 hours."
  cta: 'Try it'

enforced: false # boot validator silent until models land

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: moments.index
    label: Moments
    url: /hub/moments
    lifecycle: soon
    spa: true
