# Rose — a wordless daily gesture. One tap on a Mate's profile sends
# them a rose; it joins a small stack drawn outward from the centre of
# /hub/rose, and at 3am Sydney the stack is gone with nothing kept.
#
# Carries what the old Kronk meant by a nudge ("send someone a little
# bump") back under its own name, now that Nudges is the messenger.
# This version of Kronk is named Rose — the gesture is how the name
# shows up in the product. Spec: docs/spaces/rose.md.
#
# The korner has no compose route: a rose is sent from a person's
# profile, or from /hub/rose itself through a Ж menu action that opens a
# picker of your Mates (2026-10-11). And no feed projection: a rose is
# not a post and mints no Status.

slug: rose
name: Rose
purpose: 'To let one person tell another they were thought of today, without asking anything of them.'
tagline: 'Roses you were given today.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: 'A rose is a wordless gesture: a way to tell a Mate they were thought of today.'
  why: "A small kindness that asks nothing back. No message, no reply, no count. Today's roses clear at 3am, Sydney time."
  how:
    - "Tap the rose on a Mate's profile, or Send a rose from the Ж menu here."
    - 'You can send each Mate one rose a day.'
    - 'Nudges tells you when a rose arrives. You can turn that off in Rose settings.'
    - 'Tap a rose to see who sent it.'
icon:
  material: rose
render_target: native
version: 1.0.0

resources:
  - name: roses
    primary: true

storage:
  db_namespace: rose # table: roses

security:
  permissions:
    - read:accounts
  # A rose has no visibility ladder: it is addressed to exactly one
  # person and only they can see it. Mates-only on the send side is
  # enforced in Rose::SendService, not by a scope the sender picks.
  visibility_scopes: []
  maintainers:
    - moderator
  federates: false

emits:
  # Nudges turns it into a notification for the recipient
  # (config/korners/nudges.yaml).
  - name: rose.sent
    payload:
      - actor_account_id
      - recipient_account_id

listens: [] # nothing reacts to a rose; that is the point

feed_projection:
  card: # not-applicable — a rose has no Status and never reaches a feed.
  discriminator: # n/a

notifications:
  types:
    # Delivered on the Nudges bus (config/korners/nudges.yaml listens).
    - name: rose.received
      delivery: nudge
      event: rose.sent
      subject_type: rose
      default_push: false
      aggregation: none
      interactive: true # See your roses opens /hub/rose

# The notification is on by default and switched off like any other
# nudge type, on /hub/rose/settings or /settings/notifications
# (Nudges::MuteCatalogue `rose.received`, Tal 2026-10-19). It lands on
# the Notifications face, never in a chat.
settings: []

hub_teaser:
  static: 'Gone by 3am.'

launch:
  blurb: 'Rose — one tap on a Mate, no message, gone by morning.'
  cta: 'See your roses'

enforced: true

nodes:
  - id: rose.index
    label: Rose
    url: /hub/rose
    lifecycle: live
    spa: true

  # No settings node: /hub/rose/settings is the generic korner settings
  # page, which holds the notification toggle.
