# Slugs a korner cannot claim as its `slug:`. The boot validator warns
# when a manifest's slug appears in this list or duplicates another
# manifest's slug.
#
# See docs/kronk_korner_spec.md §4.4.

# Platform surfaces
# NOTE: `nudges` is intentionally NOT reserved during the 2.0.0 transition
# — the current shipping korner still owns that slug via nudges.yaml.
# Once the Nudges cutover completes (task #30) and the manifest is
# retired, `nudges` moves back into this list as a reserved platform stem.
- home
# `tree` is reserved for a planned space mapping invite lineage — who
# brought whom to Kronk. Reserved 2026-07-18 when the Kommons Tree was
# renamed to the Skeleton to free the word.
- tree
- explore
- search
- tags
- settings
- admin

