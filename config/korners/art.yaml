# Art — a house for physical works. Scaffolded 2026-08-14 as a
# multi-discipline umbrella (writing, photography, music, voice, gallery)
# and refocused 2026-09-09 down to physical works only: paintings,
# sculptures, prints, drawings, ceramics, photographs of artworks.
# Sibling korners now own the disciplines that split off — Booth for
# music, Kronikles for long-form writing, Cinema for short films.
# Kept `enforced: false` while the composer + models are still to land;
# the existing KronkDial browser under features/art/ predates the
# refocus and will be pared back when the real content plumbing ships.

slug: art
name: Art
purpose: 'To share physical works — paintings, sculptures, prints, drawings, ceramics and the photos of them.'
tagline: 'Physical works — brought online.'
icon:
  material: palette
render_target: native
version: 0.0.1

resources: [] # no korner-owned tables yet — models land with the composer

security:
  # Public-first browsing surface; per-piece scopes will come with the
  # composer flow. Kept as the four standard scopes so a future
  # composer can promote/demote a piece without a schema change.
  visibility_scopes:
    - public
    - orbit
    - mates
    - self_only

# Cross-korner attachments (docs/kronk_korner_attachments.md).
# Wildcard link — an Art piece can be linked from any source.
accepts:
  - from: '*'
    kind: link

hub_teaser:
  static: 'Physical works — brought online.'

launch:
  blurb: 'Art — paintings, sculptures, prints and the photos of them.'
  cta: 'Post a piece'

# The Ж menu (floating bubble) picks this up automatically: while the
# viewer is anywhere under /hub/art, the bubble's Post action reads
# `label` + `route` here and navigates to the composer. Route is a
# placeholder until the composer ships — matches the pattern other
# scaffolded korners use.
compose:
  label: 'Post a piece'
  route: '/hub/art/composer'

enforced: false # scaffold — L1-L11 gate flipped on once the composer + models land

# ── Directory nodes ──────────────────────────────────────────────
nodes:
  - id: art.index
    label: Art
    url: /hub/art
    lifecycle: soon
    spa: true
