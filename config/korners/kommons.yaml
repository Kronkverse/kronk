# Kommons — governance & structural coordination
# Retroactively authored from the shipped code on `main`.
# See docs/kronk_korner_spec.md for the framework this manifest declares against.

slug: kommons
name: Kommons # rendered as ₭ommons in nav (unicode Kra)
purpose: "To let the community decide Kronk's structural moves together, in the open."
tagline: 'Kronk is Kommunal, we build it together. What should we build next?'
icon:
  material: construction
  text_glyph: '✦'
render_target: native # web-native React; §9 render_target semantics not enforced yet
version: 0.1.0 # retrospective; predates the spec

security:
  permissions:
    - read:proposals
    - write:proposals
  visibility_scopes: [] # uses Mastodon's standard visibility for shared statuses
  maintainers:
    - moderator
  federates: false # local-only per §8.8

resources:
  - name: proposals
    primary: true # /governance is the canonical entry — moves under /hub/kommons in §4 migration
  - name: proposal_votes
  - name: proposal_attachments # mockups/briefs attached to a proposal for implementers
  - name: proposal_backings # token stakes on a proposal (token ledger, #366)

storage:
  db_namespace: proposal_ # proposal_* tables: proposals, proposal_votes, proposal_attachments, proposal_backings
  media_prefix: # not-implemented — proposal media currently uses Mastodon default paths
  redis_prefix: # not-implemented — no dedicated Kommons Redis usage

emits:
  - kommons.proposal.backed # a Kronker stakes tokens on a proposal; Nudges routes to the author's Mate chat
  - kommons.proposal.frothed # a Favourite lands on the proposal's discussion Status; Nudges routes to author
listens: []

feed_projection:
  card: kommons_card # StatusKommonsCard, now wrapping StatusKornerCard (feature/korner-cards)
  title_from: title
  summary_from: summary
  links_to: /governance # implicit — routed via Rails, not derived from a hub-prefixed slug
  default_visibility: public
  discriminator: status.post_type == 'proposal' # existing convention; §8.3 aspires to manifest-driven detection

  status_association: proposal # framework: Status.has_one :proposal
  status_post_type: proposal # framework: status.post_type value

notifications:
  types:
    # proposal_backed + proposal_comment are deferred: their trigger surfaces
    # don't exist yet (token backing has no caller; there's no proposal-comment
    # model/endpoint). They return here — and L10 requires their producers —
    # once those surfaces ship. Declaring only what actually fires (§5.7).
    - name: proposal_challenged
      subject_type: proposal
      default_push: true
      aggregation: default
      interactive: true # nudge — reply-able, react-able
    - name: proposal_status_changed
      subject_type: proposal
      default_push: false # noisy for backers/opposers — off by default
      aggregation: default
      interactive: false
    - name: task_assigned
      subject_type: task
      default_push: true
      aggregation: none
      interactive: true

# Per-user settings surfaced at /hub/kommons/settings (spec §K.3.3).
settings:
  - name: preferred_proposal_types
    kind: multi_enum
    options: [small, medium, large]
    default: [small, medium, large]
    scope: user
    label: Show me proposal sizes
    description: Filter your Kommons Hub feed to just these sizes. All three ships by default.
  - name: notify_on_status_change
    kind: boolean
    default: false
    scope: user
    label: Notify me when a proposal I backed changes state
    description: Fires a nudge when a proposal you've backed advances, gets vetoed, or delivers.

launch: # retrospective — Kommons predates launch cards
  blurb: '₭ommons — the space where structural moves are decided.'
  cta: 'Tap in'

# The Ӂ menu's Post button while inside Kommons. Kommons' native create action
# IS proposing: a proposal is Kommons content. On a Space page the composer
# scopes the proposal to that space (the bubble appends ?space=<slug>).
compose:
  label: 'Open a Proposal'
  # Unscoped entry: the target picker (choose which page the proposal is about).
  # On a space/meta page the Ӂ menu skips this and scopes straight to the
  # Proposer — see kronk_menu.tsx.
  route: '/hub/kommons/pick'

feature_flag: # not-implemented — Kommons is unconditionally mounted on main
enforced: true # framework: on this branch; boot validator enforces

# ── Directory nodes (Kommons 2.0 — the feedback tree) ──────────────
# See lib/kronk/node_registry.rb for schema. The Directory renders as the Lattice view.
nodes:
  - id: kommons.index
    label: Proposals
    url: /hub/kommons
    lifecycle: live
    spa: true
    links:
      - to: kommons.directory
        kind: related
        description: Feedback proposals originate from nodes in the Directory.
  - id: kommons.directory
    label: Directory
    url: /hub/kommons/lattice
    lifecycle: live
    spa: true
    links:
      - to: kommons.index
        kind: creates
        description: Every planted feedback item becomes a proposal on the Kommons list.
  - id: kommons.propose
    label: Proposer
    url: /hub/kommons/propose
    lifecycle: live
    spa: true
    links:
      - to: kommons.index
        kind: creates
        description: The Proposer drafts a new proposal onto the Kommons list.
  - id: kommons.new_korner
    label: Propose a new Korner
    # Deep-link into the Proposer with this node as the anchor. Proposals
    # tagged here are "there should be a new space in Kronk for X."
    url: /hub/kommons/propose?node=kommons.new_korner
    lifecycle: live
    spa: true
    links:
      - to: kommons.index
        kind: creates
        description: A shipped new-korner proposal spawns a manifest under `config/korners/` and lights up the tile on the Hub.

  # The 2.0.0 rebuild-review nodes that used to live here were removed in
  # favour of the Kronk org pillar (`kronk.*` in config/kronk_nodes.yaml): a
  # proposal is Kommons content that sits within a real Kronk surface, not a
  # tree node of its own, so the rebuild backlog re-homed onto `kronk.how_it_works`
  # (how Kronk is built) rather than synthetic "Review: …" page-nodes.
