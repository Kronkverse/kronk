# Krew — a framework primitive for shareable, multi-poster spaces.
# Krews are standalone (they can exist without a hosting korner) but
# can also be attached to any korner (spec §Krews). Phase 1 of the
# Krews rebuild is the URL + manifest flip: slug `groups` → `krew`,
# `/hub/groups` → `/hub/krew`. The DB tables (`groups`,
# `group_memberships`, `statuses_groups`), the `Group` model, and the
# `/api/v1/groups` API stay named as-is until the Phase 2 backend
# rename lands. See docs/KRONK_KREWS.md for the full concept.

slug: krew
name: Krews
purpose: 'To let several people share selectively — a defined group of people you can post to, without a feed of its own.'
icon: groups
render_target: web
version: 1.0.0

# Table names are still `groups*`; only Phase 2 flips them. The
# resources block is normative for the boot validator, so leave the
# names matching the schema until Phase 2 renames both together.
resources:
  - name: groups
    primary: true
  - name: group_memberships
  - name: statuses_groups # join to Status for multi-group posts

storage:
  db_namespace: group_ # unchanged until Phase 2
  media_prefix: (none)

security:
  ownership_model: seeder_and_members
  visibility: public # discoverable listing
  member_gate: approval_optional # seeders may require join approval
  archive_gate: seeder_only

feed_projection:
  card: # not-built — Krew renders as its own /hub/krew web surface (render_target: web), not a timeline card
  title_from: name
  summary_from: description
  # Deliberately no status_association: a Krew is not represented by a
  # single Status. Its conversation lives in Nudges (§1 of the brief).
  links_to: /hub/krew/<id>
  default_visibility: public

settings:
  - name: notify_on_new_post
    kind: boolean
    default: true
    scope: user
  - name: default_visibility
    kind: string
    default: public
    scope: group

# Event names still say `group.*` because the emitting code hasn't
# renamed yet (Phase 2). Payload keys stay `group_id` for the same
# reason. Nudges listeners are wired to these names.
emits:
  - name: group.post.created
    payload:
      - group_id
      - status_id
      - account_id
  - name: groups.member.joined
    payload:
      - actor_account_id
      - group_id
  - name: groups.member.left
    payload:
      - actor_account_id
      - group_id
listens: []

compose:
  label: 'New krew'
  route: '/hub/krew/new'

hub_teaser:
  static: 'Shareable, multi-poster spaces.'

launch:
  blurb: 'Krews — a defined group of people you can share to, without a feed of its own.'
  cta: 'Start a krew'

enforced: true

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: krew.index
    label: Krews
    url: /hub/krew
    lifecycle: live
    spa: true

  - id: krew.detail
    label: Krew detail
    url: /hub/krew/:id
    lifecycle: live
    spa: true
