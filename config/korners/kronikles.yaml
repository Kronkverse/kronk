# Kronikles — a house for long-form writing. Scaffolded 2026-09-09
# alongside Cinema, as the Art korner narrows down to physical works
# only (paintings, sculptures, photos of works) and its old "writing"
# discipline moves out into its own korner.
#
# `enforced: false` + `lifecycle: soon` per Korner Standard §L1 golden
# rule until the models, composer and reader land. Boot validator stays
# quiet; the Hub tile treats this as a "coming soon" tile.

slug: kronikles
name: Kronikles
purpose: 'To make space for long-form writing — essays, stories, journals, letters.'
tagline: 'Long-form writing, at length.'
icon:
  material: menu_book
render_target: native
version: 0.0.0

resources: [] # no korner-owned tables yet — models land with the composer

security:
  # Public-first browsing surface; per-piece scopes will come with the
  # composer flow. Kept as the four standard scopes so a future
  # composer can promote/demote a piece without a schema change.
  visibility_scopes:
    - public
    - orbit
    - mates
    - self_only

# Cross-korner attachments (docs/kronk_korner_attachments.md).
# Wildcard link — a Kronikle can be linked from any source.
accepts:
  - from: '*'
    kind: link

hub_teaser:
  static: 'Long-form writing, at length.'

launch:
  blurb: 'Kronikles — essays, stories, journals, letters.'
  cta: 'Start a Kronikle'

# The Ж menu (floating bubble) picks this up automatically: while the
# viewer is anywhere under /hub/kronikles, the bubble's Post action
# reads `label` + `route` here and navigates to the composer. Route is
# a placeholder until the composer ships — matches the pattern other
# scaffolded korners use.
compose:
  label: 'Start a Kronikle'
  route: '/hub/kronikles/composer'

enforced: false # scaffold — L1-L11 gate flipped on once the composer + reader land

# ── Directory nodes ──────────────────────────────────────────────
nodes:
  - id: kronikles.index
    label: Kronikles
    url: /hub/kronikles
    lifecycle: soon
    spa: true
