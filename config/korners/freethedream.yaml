# FreeTheDream — a self-organising system for bringing things to life
# together (docs/spaces/freethedream.md). People seed emergences; anyone
# who joins coalesces gangs and adds to Thing Bringing, Actualise and On
# offer, and owns what they add. Everyone in an emergence is in its Krew.
# Each person keeps their Mycelium, what they have, private to them;
# sharing something into an emergence offers it there, and Mycelium meets
# the emergence's needs (suggestions, From my Mycelium, a match nudge).
# ("Project" stays the name in code and the database.)
#
# Native korner: features/freethedream (Stage + detail routes),
# Api::V1::Freethedream::*, tables freethedream_*. Kashka leads the map
# and the look, reading the same API. Live on the Hub since 2026-10-13
# (Tal). It has no feed card: a project doesn't post to the feed yet, and
# its settings page is the shared /hub/:slug/settings.
#
# Kashka's earlier map page (public/freethedream-preview.html) and its
# document backend (Api::V1::FreethedreamController, freethedream_documents)
# are still there for her standalone copy; /hub/freethedream no longer
# shows it.

slug: freethedream
name: Projekts
tagline: 'Seed a projekt. Bring it to life together.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: 'A place to bring things to life together. Someone seeds a projekt, like a doof, an album, an app or a co-op, and the people who join organise it themselves.'
  why: "Big things happen when everyone brings a piece. Nobody approves from above: whoever joins can see what's needed and step up."
  how:
    - 'Start a projekt from one of your Krews (Konnect, then New projekt). Everyone in the Krew is in it, and joining the Krew joins you in.'
    - 'Add a Komponent for one part of it, like Sound, Design or Paperwork.'
    - "Add what needs bringing, and say how much of it you'll bring."
    - "Add an idea to Actualise and you're on it, or jump on board someone else's."
    - "List what you have in your Mycelium. Only you see it until you share something with a projekt, where it's on offer and meets what's needed."
    - "Talk it through in threads, and resolve each one once it's settled."
purpose: 'To let people seed projekts and bring them to life from the bottom up: Komponents of people, things to bring, ideas to actualise, and Mycelium: what each person has, ready to share.'
icon:
  material: spiral
render_target: native
version: 0.1.0

security:
  permissions:
    - read:statuses
    - write:statuses
  visibility: public
  federation: none
  maintainers: moderator

resources:
  # `freethedream/projects` so KornerRegistry.model_for resolves the
  # namespaced model (Freethedream::Project) for korner attachments.
  - name: freethedream/projects # emergences and their gangs
    primary: true
    path: /hub/freethedream/p/:id
  - name: freethedream_items # things to bring, to actualise, offers
  - name: freethedream_mycelium_items # each person's Mycelium: what they have

storage:
  db_namespace: freethedream_ # tables: freethedream_projects, _items, _memberships, _mycelium_items …
  media_prefix: # not-applicable
  redis_prefix: # not-implemented

emits:
  # Someone tagged another person (@username) in an emergence's talk.
  # Nudges tells them, linking to the page the talk is on.
  - name: freethedream.comment.mentioned
    payload:
      - actor_account_id
      - recipient_account_id
      - project_id
  # A need or Actualise item was added that something you've shared into
  # that emergence from your Mycelium could cover. Only you hear of it.
  - name: freethedream.mycelium.matched
    payload:
      - actor_account_id
      - recipient_account_id
      - item_id
listens: []

# A Kalendar event links to the emergence it is the event for: the Overview
# shows its date, place, map pin and RSVPs (docs/spaces/freethedream.md).
accepts:
  - from: '*'
    kind: link

attaches:
  # Any record here can be linked to anything that takes links, by whoever
  # looks after it (decisions.md, 2026-10-21).
  - to: '*'
    kind: link
    trigger: user
    lifecycle: keep

feed_projection:
  card: # none: emergences don't post to the feed (reach is out of the first build)
  status_association: # not-applicable

settings: []

hub_teaser:
  static: 'Seed a projekt, or join one and bring something to life.'

# Konnect (decisions.md, 2026-10-23; docs/korners/adding_a_korner.md,
# Korner attachments §2.6): this korner's Konnections and how they work.
konnect:
  # What one of its records is called wherever Kronk names it beside
  # its title ("the Ember event"), so records that share a title can be
  # told apart (decisions.md, 2026-10-26).
  # A gang is the one exception: its records say gang (KornerRecords.noun_for).
  noun: projekt
  # The Konnect picker can make a new one from anywhere: "New …" opens
  # `compose.route` with `?konnect=<source slug>:<source id>`, and the
  # composer Konnects what it makes to that source.
  make: true
  # What a Konnection with these spaces does beyond the link itself.
  effects:
    - with: kalendar
      does: "An event Konnected to a projekt (or one of its Komponents) is shared with the projekt's Krew, which joins its audience."
    - with: krew
      does: "A projekt lives in one Krew and is Konnected to it when it is made; that link can't be taken off. Konnected to any other Krew it is only a link."

compose:
  label: 'Seed a projekt'
  route: '/hub/krew/composer/projekt'

views:
  - { key: all, label: 'All projekts', tagline: 'Every projekt on Kronk' }
  - { key: mine, label: 'Mine', tagline: "Projekts you're in" }

header:
  # The title is the view switch (the standard rotator, docs/design.md
  # Frame, SpaceNav): it turns through the three views, each with its
  # own tagline. Until 2026-10-29 FreeTheDream showed a fixed title over
  # a row of text pills instead, the one korner with taglined views
  # that didn't rotate.
  rotator: true

launch:
  blurb: 'Projekts — seed a projekt and bring it to life together: Komponents, Thing Bringing, Actualise and On offer.'
  cta: 'See the projekts'

feature_flag: # not-implemented
enforced: true # live since 2026-10-13
# Projekts live inside Krews (Tal, 2026-10-30): a Krew's page shows its
# projekts and makes new ones, so the space is off the Hub and the rail.
hub_visible: false

nodes:
  - id: freethedream.index
    bucket: hub
    parent: freethedream
    label: Projekts
    url: /hub/freethedream
    lifecycle: live
    spa: true
