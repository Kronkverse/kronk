# FreeTheDream — a self-organising system for running projects together
# (docs/spaces/freethedream.md). People start projects; anyone who joins
# adds parts, ideas, needs, jobs and offers and owns what they add. Each
# person keeps a private inventory and shares chosen items into projects,
# and a project's audit sets its needs against what's been shared.
#
# Native korner: features/freethedream (Stage + detail routes),
# Api::V1::Freethedream::*, tables freethedream_*. Kashka leads the map
# and the look, reading the same API. Live on the Hub since 2026-10-13
# (Tal). It has no feed card: a project doesn't post to the feed yet, and
# its settings page is the shared /hub/:slug/settings.
#
# Kashka's earlier map page (public/freethedream-preview.html) and its
# document backend (Api::V1::FreethedreamController, freethedream_documents)
# are still there for her standalone copy; /hub/freethedream no longer
# shows it.

slug: freethedream
name: FreeTheDream
tagline: 'Start a project. Organise it together.'
purpose: 'To let people start projects and organise the work on them from the bottom up: parts, ideas, needs, jobs, offers and an audit of what the community has.'
icon:
  material: spiral
render_target: native
version: 0.1.0

security:
  permissions:
    - read:statuses
    - write:statuses
  visibility: public
  federation: none
  maintainers: moderator

resources:
  # `freethedream/projects` so KornerRegistry.model_for resolves the
  # namespaced model (Freethedream::Project) for korner attachments.
  - name: freethedream/projects # projects and their sections
    primary: true
  - name: freethedream_items # ideas, needs, jobs, offers
  - name: freethedream_assets # each person's inventory

storage:
  db_namespace: freethedream_ # tables: freethedream_projects, _items, _memberships, _assets …
  media_prefix: # not-applicable
  redis_prefix: # not-implemented

emits:
  # Someone in a project invited another person to have a look. Nudges
  # listens and sends that person a notification linking to the Overview.
  - name: freethedream.project.invited
    payload:
      - actor_account_id
      - recipient_account_id
      - project_id
listens: []

# A Kalendar event links to the project it is the event for: the Overview
# shows its date, place, map pin and RSVPs (docs/spaces/freethedream.md).
accepts:
  - from: '*'
    kind: link

feed_projection:
  card: # none: projects don't post to the feed (reach is out of the first build)
  status_association: # not-applicable

settings: []

hub_teaser:
  static: 'Start a project, or join one and take something on.'

compose:
  label: 'Start a project'
  route: '/hub/freethedream/composer'

views:
  - { key: all, label: 'All projects', tagline: 'Every project on Kronk' }
  - { key: mine, label: 'Mine', tagline: "Projects you're in" }
  - { key: inventory, label: 'Inventory', tagline: 'What you have to offer' }

launch:
  blurb: 'FreeTheDream — start a project and organise it together: parts, needs, jobs, offers and ideas.'
  cta: 'See the projects'

feature_flag: # not-implemented
enforced: true # live on the Hub (Tal, 2026-10-13)

nodes:
  - id: freethedream.index
    bucket: hub
    parent: freethedream
    label: FreeTheDream
    url: /hub/freethedream
    lifecycle: live
    spa: true
