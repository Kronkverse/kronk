# FreeTheDream — a map of community projects (Kashka's page,
# repo Kashka-25/free-the-dream-map), drawn on the YOU yin-yang with
# Kronk's purples on the cosmos side.
#
# The map is open: anyone adds a project and it's on the map straight
# away, run by whoever added it, who chooses whether anyone can join in
# running it or they accept helpers. No admins, no approval.
#
# The page is public/freethedream-preview.html, rendered through
# KornerIframe; public/freethedream-config.js switches it to Kronk's shared
# backend (Api::V1::FreethedreamController, table freethedream_documents,
# one document per member, each viewer's /state filtered on the server).
# It stays `enforced: false` / lifecycle `soon` under the Korner Standard
# until the native layers land (docs/spaces/freethedream.md).

slug: freethedream
name: FreeTheDream
tagline: 'Community projects you can join, help or start.'
purpose: 'To show the projects people in the community are running, how to get involved in each, and let anyone suggest a new one.'
icon:
  material: spiral
render_target: native
version: 0.1.0

security:
  permissions: [] # session-authenticated from its iframe; each member writes only their own document
  visibility: public
  federation: none
  maintainers: moderator

resources:
  - name: freethedream_documents # one JSON document per member
    primary: true

storage:
  db_namespace: freethedream_ # table: freethedream_documents
  media_prefix: # not-applicable — project logos are small inline images
  redis_prefix: # not-implemented

emits: []
listens: []

feed_projection:
  card: # not-applicable — the map is the view
  status_association: # not-applicable

settings: []

hub_teaser:
  static: 'Find a community project to help with, or suggest your own.'

launch:
  blurb: 'FreeTheDream — a map of community projects: see what each one is, how to get involved, or suggest your own.'
  cta: 'Open the map'

feature_flag: # not-implemented
enforced: false # page in an iframe; flips once the Standard's native layers land

nodes:
  - id: freethedream.index
    bucket: hub
    parent: freethedream
    label: FreeTheDream map
    url: /hub/freethedream
    lifecycle: soon
    spa: true
