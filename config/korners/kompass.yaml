# Kompass — opt-in presence and location. Who's around, if they choose
# to say. Every share is a deliberate act; nothing is broadcast unless
# the user flips a toggle each session.
#
# Ships in 2.0.0 as a prototype-driven surface at /hub/kompass (Kommons
# proposal #116969555027300161 "New Korner: Map — To see where your
# mates are and share activities"). The frontend view is the
# hand-authored prototype iframed via features/kompass_v2/. Backend
# (presence_states + real-time infra) still to build — this manifest
# stays enforced so the tile lights up on the Hub, but the surface is
# read-only until wiring lands.

slug: kompass
name: Kompass
purpose: "To let people signal presence on their own terms — who's around, only if they choose to say."
icon: explore
render_target: native
version: 0.0.0

resources:
  - name: presence_states
    primary: true

storage:
  db_namespace: presence_ # planned; may become Redis-only depending on retention
  media_prefix: spaces/kompass/

feed_projection: # no feed projection — presence is not a feed item
  card: null

settings:
  - name: default_share_scope
    kind: enum
    options: [none, friends, groups, kommunity]
    default: none
    scope: user
  - name: auto_expire_minutes
    kind: integer
    default: 60
    scope: user

emits: []
listens: []

hub_teaser:
  static: "Who's around, if they choose to say."

launch:
  blurb: 'Kompass — opt-in presence. Nothing shared unless you choose to.'
  cta: 'Peek in'

enforced: true

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: kompass.index
    label: Kompass
    url: /hub/kompass
    lifecycle: soon
    spa: true
