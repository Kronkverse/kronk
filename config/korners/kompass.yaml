# Kompass — opt-in presence and location. Who's around, if they choose
# to say. Every share is a deliberate act; nothing is broadcast unless
# the user flips a toggle each session.
#
# WIP manifest — no backend yet. `enforced: false`. Presence needs
# real-time infrastructure (WebSocket or similar) that hasn't been
# built; this is one of the more infrastructure-heavy 2.x korners.
# See docs/kronk_korner_spec.md §New korners.

slug: kompass
name: Kompass
icon: explore
render_target: native
version: 0.0.0

resources:
  - name: presence_states
    primary: true

storage:
  db_namespace: presence_ # planned; may become Redis-only depending on retention
  media_prefix: spaces/kompass/

feed_projection: # no feed projection — presence is not a feed item
  card: null

settings:
  - name: default_share_scope
    kind: enum
    options: [none, friends, groups, kommunity]
    default: none
    scope: user
  - name: auto_expire_minutes
    kind: integer
    default: 60
    scope: user

emits: []
listens: []

hub_teaser:
  static: "Who's around, if they choose to say."

launch:
  blurb: 'Kompass — opt-in presence. Nothing shared unless you choose to.'
  cta: 'Peek in'

enforced: false
