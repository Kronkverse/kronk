# Klot — private menstrual-cycle tracker (phase-only sharing)
# Retroactively authored from the shipped code on `dev/tbone` (live on shadow, not on main).
# Reference prototype: /tree.html was the mind-map; this space is the tides_prototype.html translated to Kronk.

slug: klot
name: Klot
tagline: 'Celebrating the cycle which brought us all to this world.'
# What the i moon's pop-up says (SpaceInfoDialog). A first draft
# (2026-10-16), for Tal to edit on shadow.
about:
  what: "A private tracker for your menstrual cycle. Your dates stay yours. At most, the people you choose see which phase you're in."
  why: 'To honour the cycle and share where you are in it, without giving away the data.'
  how:
    - 'Log when your period starts and ends, today or on an earlier day.'
    - 'Note how a day went: flow, symptoms and a few words.'
    - "Watch your cycle, phase and next period take shape as you log. You don't need to know your cycle length."
    - 'Share your phase with chosen Mates under My cycle. Only the name of the phase reaches them.'
    - 'See the phases of people who share with you under Circle.'
purpose: 'To let kronkers share the phase of their cycle, not the data.'
icon:
  material: gynecology
render_target: native
version: 0.1.0

security:
  permissions:
    - read:statuses # required for the sovereignty note + phase-only endpoint auth
    - write:statuses # required for logging periods + updating settings
  visibility_scopes: # Klot's PhasesController is a bespoke capability — see §7 "secure only once"
    - klot_phase_viewer # implicit; enforced today by ownership check + the KlotShare allowlist.
      # Sanctioned exception: migrates onto the shared authorization layer (§7) when it lands.
  maintainers:
    - moderator # nominal; no cross-user moderation actions exist for Klot data
  federates: false # explicitly local-only, by the same sovereignty argument as the phase endpoint

# Takes no links, on purpose (decisions.md, 2026-10-21).
no_attachments: "Cycle logs are private health records, nobody else's to link."

resources:
  - name: cycle_logs # one row per period: started_on, ended_on; newest row anchors the phase
    primary: true
  - name: cycle_profiles # per-account lengths typed in before the log worked them out; a stand-in only
  - name: cycle_days # one row per day: bleeding, symptoms, a note. Owner-only
  - name: phase_shares # allowlist of viewer_account_ids who may see this account's phase

storage:
  db_namespace: # not-applicable — Klot follows the brief's naming
    # (CycleProfile/CycleLog/PhaseShare per docs/spaces/klot.md)
    # rather than clustering under a `klot_` prefix. Same shape as
    # Kalendar (uses `events`) or Booth (uses `booth_sets`).
  media_prefix: # not-applicable — Klot deliberately holds no media
  redis_prefix: # not-implemented

emits: []
listens: []

feed_projection:
  card: # not-applicable — Klot is a body-data Korner; deliberately does NOT project.
    # The sovereignty contract (Api::V1::Klot::PhasesController + KlotShareSerializer) is that
    # only phase-name + moon glyph reaches an authorized viewer, and never on the shared feed.
    # Framework-conformance here is *refusing* the projection, not implementing it.
  discriminator: # n/a

subscription:
  default: # not-applicable — Klot data is per-account owner-visible only; subscription is not the right primitive.
    # The KlotShare table is the correct primitive: a per-viewer opt-in, revocable, owner-controlled.

# Per-user settings surfaced at /hub/klot/settings (spec §K.3.3).
settings:
  - name: cycle_length_days
    kind: integer
    default: 28
    min: 20
    max: 45
    scope: user
    label: Average cycle length (days)
    description: Used only for phase estimation. Nothing shared. Stored client-computed.
  - name: period_length_days
    kind: integer
    default: 5
    min: 2
    max: 10
    scope: user
    label: Average period length (days)
  - name: share_phase_publicly
    kind: boolean
    default: false
    scope: user
    label: Let approved shares see the current phase name
    description: Even when on, only accounts you've explicitly granted a KlotShare to can see it. Raw dates never leave your account.

# SpaceNav view switcher (first entry = default, bare /hub/klot).
# Circle (inbound projection — mates + phase visualisation) is the
# landing view; Mine (owner's own log + settings) is the second view.
# Circle reads /api/v1/klot/circle, Mine reads /api/v1/klot/self.
views:
  - { key: circle, label: Circle }
  - { key: mine, label: My cycle }

launch:
  blurb: 'Klot — track your cycle. Share the phase, not the data.'
  cta: 'Tap in'

feature_flag: # not-implemented
enforced: true # backend + surface both landed in the rebuild line (alpha.222 + Phase 2 UI)

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: klot.index
    label: Klot
    url: /hub/klot
    lifecycle: live
    spa: true
