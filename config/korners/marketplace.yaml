# Marketplace — listings, offers, services.
# Greenfield reference korner: built to spec §5 from day one — canonical
# status_id linkage, dedicated tables, no retrofitting.

slug: marketplace
name: Marketplace
purpose: "To let kronkers offer and find creations, listings, and services person-to-person."
icon: inventory_2
render_target: native
version: 2.0.0

security:
  permissions:
    - read:listings
    - write:listings
    - read:statuses # reuses Mastodon's read scope for public listings
    - write:statuses # reuses for creating a shared Status per listing
  visibility_scopes:
    - public
    - followers
    - friends_of_friends
  maintainers:
    - moderator
  federates: false

resources:
  - name: listings
    primary: true
  - name: listing_photos
  - name: listing_offers

storage:
  db_namespace: listing_ # tables: listings, listing_photos, listing_offers
  media_prefix: spaces/marketplace/
  redis_prefix: 'marketplace:'

emits:
  - marketplace.listing.published
  - marketplace.listing.reserved
  - marketplace.listing.closed
  - marketplace.offer.made
  - marketplace.offer.accepted

listens: []

feed_projection:
  card: marketplace_card
  title_from: title
  summary_from: description
  status_association: listing # framework: Status.has_one :listing via status_id (§5.5)
  links_to: /hub/marketplace/listings/<id>
  default_visibility: public

notifications:
  types: []
  # All four listing_* types are deferred: Marketplace has no notification
  # producers (and its subject_types listing/listing_offer are not yet wired to
  # delivery). They return here — with producers — when Marketplace notification
  # delivery ships. The L10 gate requires a declared type to be registered (§5.7).

settings:
  - name: default_publish_visibility
    kind: enum
    options: [public, followers, friends_of_friends]
    default: public
    scope: user
  - name: notify_on_offer
    kind: boolean
    default: true
    scope: user
  - name: auto_close_after_days
    kind: integer
    default: 90
    scope: user

compose:
  label: 'New listing'
  route: '/hub/marketplace/new'

hub_teaser:
  static: 'Creations, listings, services — traded person-to-person.'

launch:
  blurb: 'Marketplace — creations, listings, and services from the Kronk community.'
  cta: 'Tap in'

feature_flag: # not-implemented — Marketplace ships enabled at 2.0.0
enforced: true # item 8: serializer (L3) + /hub/marketplace mount (L5) shipped — conformant

# ── Tree nodes (Kronk 2.0 — feedback tree) ──────────────────────────
nodes:
  - id: marketplace.index
    label: Marketplace
    url: /hub/marketplace
    lifecycle: live
    spa: true
    links:
      - to: kalendar.index
        kind: listens_to
        description: Event ticket listings originate in Kalendar.
