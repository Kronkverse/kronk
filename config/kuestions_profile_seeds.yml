# Kronk-written profile Kuestions — the starting set people answer and pin
# to their profile. They replace the old profile Fields catalog
# (features/profile_shelves/profile_field_catalog.ts) one for one: `key` is
# the Field's key, so existing Field answers can move across and anything
# keyed by it (Kalendar birthdays reads `birthday`) keeps working.
#
# Loaded into `questions` (kind: profile, seed_key: key) by
# `Kuestions::ProfileSeeds.sync!`, which a migration runs and which is safe
# to re-run: it matches on key, updates title/format, and never deletes.
#
#   key     stable identifier, never renamed
#   title   the Kuestion as people see it
#   label   short name for compact places (a profile tile's tooltip)
#   format  text | longtext | list | link | date (Question::ANSWER_FORMATS)
#   group   heading in the Profile view's grid (optional)
#   author  username of the local account shown as having asked it
#           (optional; left without one when there is no such account)
#   retired true: no longer offered (Tal 2026-10-15: the full set was
#           overwhelming, and profile Kuestions are for the community to
#           ask). Kept so answers already given still show on profiles,
#           with their label and layout, and can be edited or removed.
