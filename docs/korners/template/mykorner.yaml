# Template korner manifest. Copy to config/korners/<slug>.yaml and
# rename every occurrence of `mykorner` to your slug. Read the field
# reference in docs/korners/adding_a_korner.md (Framework spec (v0.5)) and the Standard in
# docs/korners/korner_standard.md before shipping.

slug: mykorner
name: MyKorner
tagline: 'A short display-voice line about what this korner is for.'
purpose: 'One sentence for the manifest — what the korner enables that no other korner does.'
icon:
  material: extension # must be a key in MATERIAL_TO_ICON (hooks/useKornerIcon.tsx)
render_target: native
version: 0.1.0

security:
  permissions:
    - read:statuses
    - write:statuses
  visibility_scopes: []
  maintainers:
    - moderator
  federates: false

resources: []
# Once the korner has records, name the primary one and its page, which
# every link to one of them points at:
#   - name: things
#     primary: true
#     path: /hub/mykorner/:id

storage:
  db_namespace: # not-implemented — set once the korner owns tables
  media_prefix: # not-applicable / not-implemented — set once media lands
  redis_prefix: # not-implemented

emits: []
listens: []

# Attaching is on by default: a korner with records can be linked to and
# from anything that takes links. To opt out, delete both blocks and say why
# instead: `no_attachments: '<why>'` (adding_a_korner.md, Korner attachments).
attaches:
  - to: '*'
    kind: link
    trigger: user
    lifecycle: keep
accepts:
  - from: '*'
    kind: link

# Konnect: this korner's Konnections and how they work (adding_a_korner.md,
# Korner attachments §2.6). `make: true` once its composer (`compose.route`)
# Konnects what it makes with useKonnect, so the Konnect picker offers
# "New …"; `effects` only for a pair Kronk::AttachmentEffects acts on.
# `korners doctor` checks both. Leave it out until one is true.
# konnect:
#   make: true
#   effects:
#     - with: krew
#       does: 'What a Konnection with a Krew does beyond the link.'

feed_projection:
  card: # not-applicable — set the card name if this korner projects
  status_association: # the Status has_one this korner's record hangs off

settings: []

# SpaceNav view switcher (first entry = default, bare /hub/<slug>).
# Drives the AutoSpaceViewPicker; your index.tsx reads the URL to
# render the matching view. Delete this block entirely for a
# single-view korner — the picker won't render.
views:
  - { key: default, label: Default }
  - { key: other, label: Other }

launch:
  blurb: 'MyKorner — one-line elevator pitch.'
  cta: 'Open it'

feature_flag: # not-implemented
enforced: false # flip to true only when every layer of the Standard passes

nodes:
  - id: mykorner.index
    label: MyKorner
    url: /hub/mykorner
    lifecycle: soon # → 'live' once every Standard layer passes
    spa: true
