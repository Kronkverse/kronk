# Kronk design tokens — single source of truth for the aesthetic system.
#
# Structure: `<section>: { <token>: { dark, light } }`. Each token
# resolves to a CSS custom property named `--<section>-<token>` in
# _tokens.scss (generated by bin/generate-tokens).
#
# Palette values below are placeholders for the Kronk-purple family
# introduced when the planet metaphor was retired (2026-07-10). Values
# will be refined during shadow dogfooding.
#
# See docs/kronk_korner_spec.md §6 for aesthetic spec.

kronk:
  purple-primary:  { dark: '#8b5cf6', light: '#563ACC' }
  purple-bright:   { dark: '#a78bfa', light: '#6b46e0' }
  purple-deep:     { dark: '#4c1d95', light: '#3d1a72' }
  purple-muted:    { dark: '#6d5ba8', light: '#8b7fc2' }
  purple-accent:   { dark: '#c4b5fd', light: '#7c5cd8' }

semantic:
  accent:          { dark: '#c4b5fd', light: '#7c5cd8' }
