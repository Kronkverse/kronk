# Kronk design tokens — single source of truth for the aesthetic system.
#
# 2026-07-11: reverted to running Kronk-purple (blurple family) per
# Tal — Imperial regal was too dark for the current chrome.
#
# See docs/kronk_korner_spec.md §6 for aesthetic spec.

kronk:
  purple-primary:  { dark: '#6364ff', light: '#563acc' }   # Brand purple (blurple-500/600)
  purple-bright:   { dark: '#858afa', light: '#7477fd' }   # Highlight / focus
  purple-deep:     { dark: '#1f1a3a', light: '#28214f' }   # Surface tint / atmosphere
  purple-muted:    { dark: '#4a4287', light: '#8b7fc2' }   # Supporting text / low priority
  purple-accent:   { dark: '#858afa', light: '#6364ff' }   # Accent on cards, chips, borders

semantic:
  accent:          { dark: '#858afa', light: '#6364ff' }   # → var(--accent) consumer alias
