# Kronk design tokens — single source of truth for the aesthetic system.
#
# Structure: `<section>: { <token>: { dark, light } }`. Each token
# resolves to a CSS custom property named `--<section>-<token>` in
# _tokens.scss (generated by bin/generate-tokens).
#
# 2026-07-11: Imperial palette, dark-only band. Three shades — deep
# (#201655), primary (#3a2a7a), accent (#6b4bb0). No pastel bright.
# Accent doubles as bright so hover states stay within the family.
#
# See docs/kronk_korner_spec.md §6 for aesthetic spec.

kronk:
  purple-primary:  { dark: '#3a2a7a', light: '#3a2a7a' }   # Brand purple; gradient anchor
  purple-bright:   { dark: '#6b4bb0', light: '#6b4bb0' }   # Highlight / focus (same as accent — no pastel)
  purple-deep:     { dark: '#201655', light: '#2d1f65' }   # Surface tint / atmosphere
  purple-muted:    { dark: '#2d2065', light: '#3a2a7a' }   # Supporting text / low priority
  purple-accent:   { dark: '#6b4bb0', light: '#3a2a7a' }   # Accent on cards, chips, borders

semantic:
  accent:          { dark: '#6b4bb0', light: '#3a2a7a' }   # → var(--accent) consumer alias
