# Kronk design tokens — single source of truth for the aesthetic system.
#
# 2026-07-11: matched to the running production palette on
# mastodon.kronk.info. Rich indigo family — brand #6364ff, primary
# #3034a0, deep #36248c, bright #8c8dff, muted #343070.
#
# See docs/kronk_korner_spec.md §6 for aesthetic spec.

kronk:
  purple-primary:  { dark: '#3034a0', light: '#3034a0' }   # Major surface accents, borders
  purple-bright:   { dark: '#8c8dff', light: '#6364ff' }   # Highlight / focus
  purple-deep:     { dark: '#36248c', light: '#36248c' }   # Surface tint / atmosphere
  purple-muted:    { dark: '#343070', light: '#45455f' }   # Supporting text / low priority
  purple-accent:   { dark: '#6364ff', light: '#6364ff' }   # Accent on cards, chips, borders

semantic:
  accent:          { dark: '#6364ff', light: '#6364ff' }   # → var(--accent) consumer alias
